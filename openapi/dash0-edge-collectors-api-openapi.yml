          type: string
        dash0.com/sharing:
          description: 'Comma-separated list of principals to grant read access to. Supported formats: ''team:<team_id>'' and ''user:<email>''. Example: ''team:team_01abc,user:alice@example.com''. Note: this resource type does not currently enforce sharing; the field is accepted but has no effect on access.'
          type: string
    SignalToMetricsTargetDatasetMode:
