openapi: 3.2.0
info:
  title: Dash0 Edge Collectors API
  version: 1.0.0
  description: '## Selecting a dataset


    Endpoints that operate on a single dataset take it from the `dataset` query parameter, or from the `Dash0-Dataset` request header when the query parameter is absent. When both are present the query parameter wins.


    If neither is given, the request falls back to the organization''s `default` dataset — a token that is restricted to specific datasets is rejected with `403 Forbidden` in that case, so always select a dataset explicitly when using a dataset-restricted token.


    ## Resource origins


    Most resources take an optional `metadata.labels["dash0.com/origin"]`. It is a stable identifier you choose for a resource you manage as code, so your Terraform configuration, Kubernetes manifests, CLI scripts or your own tooling can address the same resource on every apply without having to store the id Dash0 generated.


    An origin is unique per organization, not per dataset. Two resources of the same type in one organization cannot share an origin, even when they live in different datasets. If you want what is really the same rule in several datasets, put the dataset in the origin, for example `probabilistic-request-sampling-sandbox` and `probabilistic-request-sampling-nonprod`. The Dash0 Kubernetes operator does the same with the origins it generates. A duplicate origin is rejected with `400`.


    You cannot change an origin. Dash0 records it when the resource is created and ignores it on later updates, so you can read a resource, edit it and send it back without stripping the label out first.


    Endpoints with an `{originOrId}` path parameter take either identifier. A value that is not a UUID is read as an origin. A `PUT` to an origin that does not exist yet creates the resource with that origin, so you can apply the same manifest repeatedly.


    ## Request body size limit


    Most API endpoints enforce a maximum request body size of 256KB. Bulk

    endpoints accept a larger body size per request to accommodate batched

    payloads.


    Requests exceeding the applicable limit are rejected with a

    `413 Content Too Large` response.'
servers:
- url: https://api.eu-west-1.aws.dash0.com
  description: API endpoint for AWS region EU (Ireland)
- url: https://api.eu-central-1.aws.dash0.com
  description: API endpoint for AWS region EU (Germany)
- url: https://api.us-east-1.aws.dash0.com
  description: API endpoint for AWS region US (N. Virginia)
- url: https://api.us-west-2.aws.dash0.com
  description: API endpoint for AWS region US (Oregon)
- url: https://api.europe-west4.gcp.dash0.com
  description: API endpoint for GCP region EU (Netherlands)
tags:
- name: Edge Collectors
paths:
  /api/edge/settings:
    get:
      summary: Retrieve settings for the organization identified by the provided Dash0 auth…
      description: 'Returns the aggregate settings payload (dataset settings, signal-to-metrics rules,

        telemetry transformation rules, observed patterns, etc.) for the organization that

        owns the provided bearer token. Designed for edge collectors running in customer

        environments that need their full configuration in one request.'
      tags:
      - Edge Collectors
      responses:
        '200':
          description: Settings for the organization identified by the auth token.
          headers:
            ETag:
              description: 'Validator for the returned representation. Send it back in

                `If-None-Match` on the next poll to get a `304` when nothing has

                changed. Settings change far more slowly than they are polled, so

                most polls are unchanged.


                Only present when conditional requests are enabled for the

                deployment.

                '
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsPerOrganizationAndDatasetInfo'
        '304':
          description: 'The caller''s `If-None-Match` matches the current representation, so no

            body is returned. A client that sends no `If-None-Match` never receives

            this status.

            '
          headers:
            ETag:
              description: Validator of the unchanged representation.
              schema:
                type: string
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getApiEdgeSettings
      x-operation-id-source: derived
components:
  schemas:
    SignalToMetricsOutput:
      properties:
        name:
          type: string
          description: The name of the resulting metric
        description:
          type: string
          description: Will be used as metadata on the generated metric.
        interval:
          $ref: '#/components/schemas/Duration'
          description: Defines at what interval to output a data point for the matched signals.
        keepResourceAttributes:
          type: array
          items:
            $ref: '#/components/schemas/Matcher'
          description: 'Key matchers that select which resource attributes from the incoming signal

            are kept as resource attributes on the output metric. An attribute is kept

            if its key matches any matcher in this list. By default, no additional

            resource attributes are kept.

            '
        keepSignalAttributes:
          type: array
          items:
            $ref: '#/components/schemas/Matcher'
          description: 'Key matchers that select which signal attributes (span attributes for traces,

            log record attributes for logs) from the incoming signal are kept as metric

            attributes (dimensions) on the output metric. An attribute is kept if its

            key matches any matcher in this list. By default, no additional signal

            attributes are kept, except for otel.span.status.code which is always set

            when the signal type is spans.

            '
      required:
      - name
      - interval
    TimeSeriesAggregationAttributeModification:
      properties:
        kind:
          type: string
          enum:
          - drop_attributes
          - keep_attributes
        spec:
          $ref: '#/components/schemas/TimeSeriesAggregationAttributeModificationSpec'
      required:
      - kind
      - spec
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    AnyValue:
      description: AnyValue is used to represent any type of attribute value. AnyValue may contain a primitive value such as a string or integer or it may contain an arbitrary nested object containing arrays, key-value lists and primitives.
      type: object
      properties:
        stringValue:
          type: string
        boolValue:
          type: boolean
        intValue:
          type: string
          format: int64
        doubleValue:
          type: number
          format: double
        bytesValue:
          type: string
          format: byte
    ObservedPatternEntry:
      type: object
      required:
      - dataset
      - extractorType
      - scopeKey
      - template
      properties:
        dataset:
          type: string
        extractorType:
          type: string
        scopeKey:
          type: string
        template:
          type: string
    TelemetryTransformationRuleContext:
      type: string
      enum:
      - resource
      - scope
      - span
      - spanevent
      - metric
      - datapoint
      - log
      - profile
      description: 'The OTTL evaluation context that determines which telemetry fields are accessible to the statements.

        Not all contexts are valid for all signal types:


        For `traces`:

        - `resource`: Transform resource-level attributes.

        - `scope`: Transform instrumentation scope-level attributes.

        - `span`: Transform individual span properties and attributes.

        - `spanevent`: Transform individual span event properties and attributes.


        For `metrics`:

        - `resource`: Transform resource-level attributes.

        - `scope`: Transform instrumentation scope-level attributes.

        - `metric`: Transform metric-level properties (name, description, type).

        - `datapoint`: Transform individual metric data point attributes.


        For `logs`:

        - `resource`: Transform resource-level attributes.

        - `scope`: Transform instrumentation scope-level attributes.

        - `log`: Transform individual log record properties (body, severity, attributes).


        For `profiles`:

        - `resource`: Transform resource-level attributes.

        - `scope`: Transform instrumentation scope-level attributes.

        - `profile`: Transform individual profile properties and attributes.


        Contexts never supply access to items lower in the protobuf hierarchy, but always supply access to

        items higher in the hierarchy. For example, a `datapoint` context can access its metric, scope, and

        resource, but a `metric` context cannot access individual data points.

        '
    CardholderDataRedactionSettings:
      type: object
      description: 'Opt-in detection and redaction of payment card numbers and related sensitive data in ingested

        telemetry, applied before Dash0 persists the signal. Matching values are masked or replaced in

        place; signals are never dropped. Detection is pattern-based and cannot catch encoded, encrypted,

        or split card numbers, so filtering at the source remains the primary mechanism.

        Absent means disabled.

        '
      properties:
        enabled:
          type: boolean
          description: 'Whether cardholder-data redaction is enabled for this dataset.

            '
      required:
      - enabled
    TelemetryTransformationRuleSpec:
      properties:
        enabled:
          type: boolean
        display:
          $ref: '#/components/schemas/TelemetryTransformationRuleDisplay'
        signal:
          $ref: '#/components/schemas/TelemetryTransformationRuleSignalType'
        context:
          $ref: '#/components/schemas/TelemetryTransformationRuleContext'
        conditions:
          $ref: '#/components/schemas/OTTLConditions'
          description: 'A list of OTTL conditions that act as a global gate for the statements. The conditions are ORed together,

            meaning only one condition needs to evaluate to true for the statements to be executed.

            '
        statements:
          $ref: '#/components/schemas/OTTLStatements'
      required:
      - enabled
      - signal
      - context
      - statements
    TelemetryFilter:
      properties:
        apiVersion:
          $ref: '#/components/schemas/SpamFilterApiVersion'
          description: 'The CRD API version used when this filter was created or last updated.

            Determines which spec shape the server returns on read.

            Defaults to `v1alpha1` when absent.

            '
        id:
          type: string
          format: uuid
          description: 'Unique identifier for this spam filter. Server-generated on creation.

            For existing filters without an ID, a deterministic UUID is derived

            from a hash of the filter specification or of the condition.

            '
        origin:
          type: string
          description: 'Immutable external identifier for this spam filter, used by

            Infrastructure-as-Code tools (Terraform, Kubernetes operator).

            When set, the filter is read-only in the UI.

            '
        source:
          $ref: '#/components/schemas/CrdSource'
        enabled:
          type: boolean
          description: 'Whether this telemetry filter is active. When absent or true, the filter

            is applied. When explicitly set to false, the filter is skipped.

            '
        name:
          type: string
          description: An optional human-readable name for this telemetry filter.
        context:
          $ref: '#/components/schemas/TelemetryFilterContext'
          description: 'The signal type this telemetry filter applies to.

            '
        filter:
          $ref: '#/components/schemas/FilterCriteria'
          description: 'Structured filter criteria in human-readable form. When provided, the

            server compiles this into an OTTL condition. Mutually exclusive with

            `condition`.

            '
        condition:
          description: 'Raw OTTL condition expression. Mutually exclusive with `filter`. Use this

            for advanced filtering that cannot be expressed via structured

            `FilterCriteria`. If the condition resolves to true, the data will be

            dropped. Supports `and`, `or`, and `()`.

            '
          $ref: '#/components/schemas/OTTLCondition'
      required:
      - context
      - condition
    SamplingDefinition:
      properties:
        kind:
          type: string
          enum:
          - Dash0Sampling
        metadata:
          $ref: '#/components/schemas/SamplingMetadata'
        spec:
          $ref: '#/components/schemas/SamplingSpec'
      required:
      - kind
      - metadata
      - spec
    AttributeFilterKey:
      type: string
      description: The attribute key to be filtered.
    GenerativeAiEvaluationJudgeOutputCategorical:
      properties:
        kind:
          type: string
          enum:
          - categorical
        spec:
          $ref: '#/components/schemas/GenerativeAiEvaluationJudgeOutputCategoricalSpec'
      required:
      - kind
      - spec
    SignalToMetricsMetadata:
      properties:
        name:
          type: string
        labels:
          $ref: '#/components/schemas/SignalToMetricsLabels'
        annotations:
          $ref: '#/components/schemas/SignalToMetricsGroupAnnotations'
      required:
      - name
    GenerativeAiEvaluationJudgeOutputCategoricalItem:
      properties:
        label:
          type: string
        intent:
          $ref: '#/components/schemas/GenerativeAiEvaluationIntent'
          description: 'Defaults to no declared intent, in which case this label renders without polarity.

            '
      required:
      - label
    SourceMapIntegration:
      properties:
        kind:
          type: string
          enum:
          - source_map
        spec:
          $ref: '#/components/schemas/SourceMapIntegrationSpec'
      required:
      - kind
      - spec
    GeoLocationSettings:
      properties:
        endUserGeoLocationStorageStrategy:
          description: 'How much geolocation we derive from end-user IP addresses and store.

            '
          $ref: '#/components/schemas/GeoLocationStorageStrategy'
      required:
      - endUserGeoLocationStorageStrategy
    DatasetLoggingSettings:
      type: object
      properties:
        retention:
          $ref: '#/components/schemas/RetentionClass'
      required:
      - retention
    SourceMapIntegrationSecrets:
      properties:
        password:
          type: string
          description: Basic auth password
        bearerToken:
          type: string
          description: Bearer token for authorization
        headers:
          type: object
          additionalProperties:
            type: string
          description: Secret header values keyed by header name
    GenAIAttributeRedaction:
      type: string
      description: 'Controls whether sensitive GenAI attribute values are redacted by the Collector.


        - `disabled`: Preserve GenAI attribute values unchanged.

        - `redact`: Replace the affected GenAI attribute content with a redacted value.

        '
      enum:
      - disabled
      - redact
    GenerativeAiEvaluationIntent:
      type: string
      enum:
      - positive
      - neutral
      - negative
      description: '- `positive`: this label represents a desirable outcome.

        - `neutral`: this label carries no polarity.

        - `negative`: this label represents an undesirable outcome.

        '
    TimeSeriesAggregationAttributeModificationSpec:
      properties:
        context:
          $ref: '#/components/schemas/TimeSeriesAggregationAttributeModificationContext'
        keyMatcher:
          $ref: '#/components/schemas/Matcher'
      required:
      - keyMatcher
    TelemetryTransformationRuleAnnotations:
      properties:
        dash0.com/created-at:
          description: Timestamp when the rule was created. Set by the server; read-only.
          type: string
          format: date-time
        dash0.com/updated-at:
          description: Timestamp of the last update. Set by the server; read-only.
          type: string
          format: date-time
        dash0.com/deleted-at:
          description: Soft-delete timestamp. Present when the rule has been deleted but not yet purged. Set by the server; read-only.
          type: string
          format: date-time
    SamplingRateLimit:
      description: 'Rate limit is helpful to avoid ingesting extremely large amounts of spans when the sampling conditions are

        triggering much more frequently than expected. For example, when the tail sampling rule is configured to match

        every error, then a system-wide outage can result in a huge amount of spans being ingested.


        Note: Probabilistic-only sampling rules do not support rate limiting.

        '
      properties:
        rate:
          type: integer
          description: 'The maximum number of traces per minute that should be allowed for this sampling rule. Dash0 will make every

            effort not to exceed this rate. However, there is also no guarantee that Dash0 will match exactly this rate.

            Dash0 is attempting to hit a rate that is lower than or equal to the configured rate.


            Dash0 cannot guarantee that very low rate limits (<=16) are upheld.

            '
      required:
      - rate
    SignalControlOperationCardinalityReductionSettings:
      type: object
      description: 'Per-organization SignalControl configuration for SaaS-side operation-name cardinality

        reduction (the operation-name-cardinality-reduction facet of SignalControl). Set centrally

        by Dash0, not customer-configurable. A sibling of `signalControlEdge` rather than a field

        inside it, matching how SaaS-side facets are modelled as their own schemas.

        '
      properties:
        enabled:
          type: boolean
          description: Whether SaaS-side operation-name cardinality reduction runs for the organization.
      required:
      - enabled
    SamplingConditionOttl:
      properties:
        kind:
          type: string
          enum:
          - ottl
        spec:
          $ref: '#/components/schemas/SamplingConditionOttlSpec'
      required:
      - kind
      - spec
    SourceMapIntegrationSpec:
      properties:
        urlPrefixes:
          type: array
          items:
            type: string
          description: URL prefixes for source map matching
        username:
          type: string
          description: Basic auth username
        authType:
          type: string
          enum:
          - none
          - basic
          - bearer
          description: 'Which authentication scheme the stored secrets carry. secretsRef alone cannot express this, because the same secret blob also holds custom header values.

            '
        headers:
          type: object
          additionalProperties:
            type: string
          description: Custom HTTP headers to include in requests
        secrets:
          description: Note, this field will be stripped out before the config is exposed via the API
          $ref: '#/components/schemas/SourceMapIntegrationSecrets'
        secretsRef:
          $ref: '#/components/schemas/SecretRef'
      required:
      - urlPrefixes
    GenerativeAiEvaluationJudgeOutputNumericSpec:
      description: 'Scores are between 0 and 1, inclusive. A higher score is always the desirable

        outcome. Write the rubric so that 1 is the best result.

        '
      properties:
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: 'A value between 0 and 1, inclusive. Absent when the eval declares no

            threshold.

            '
    GenerativeAiEvaluationLabels:
      properties:
        dash0.com/id:
          description: Unique internal ID of the eval config. Set by the server on creation; do not set manually.
          type: string
        dash0.com/origin:
          description: External identifier for API-managed resources (e.g. the CRD name from an operator or Terraform resource ID). Empty for user-created rules; non-empty for rules created via the internal API.
          type: string
        dash0.com/version:
          description: Current version of the rule. Needs to be set when updating a rule to prevent conflicting writes.
          type: string
        dash0.com/dataset:
          description: Dataset this rule belongs to. Defaults to the default dataset when absent.
          type: string
        dash0.com/source:
          $ref: '#/components/schemas/CrdSource'
    SamplingLabels:
      properties:
        dash0.com/id:
          type: string
        dash0.com/origin:
          type: string
        dash0.com/version:
          type: string
        dash0.com/dataset:
          type: string
        dash0.com/source:
          $ref: '#/components/schemas/CrdSource'
        custom:
          type: object
          additionalProperties:
            type: string
    Matcher:
      type: object
      properties:
        operator:
          $ref: '#/components/schemas/AttributeFilterOperator'
        value:
          oneOf:
          - $ref: '#/components/schemas/AttributeFilterStringValue'
          - $ref: '#/components/schemas/AttributeFilterAnyValue'
        values:
          type: array
          description: 'List of values to match against. This parameter is mandatory for the is_one_of and is_not_one_of operators.

            '
          items:
            oneOf:
            - $ref: '#/components/schemas/AttributeFilterStringValue'
            - $ref: '#/components/schemas/AttributeFilterAnyValue'
      required:
      - operator
    TimeSeriesAggregationMetadata:
      properties:
        name:
          type: string
        labels:
          $ref: '#/components/schemas/TimeSeriesAggregationLabels'
        annotations:
          $ref: '#/components/schemas/TimeSeriesAggregationAnnotations'
      required:
      - name
    FilterCriteria:
      type: array
      items:
        $ref: '#/components/schemas/AttributeFilter'
      example:
      - key: service.name
        operator: is
        value: foo
    RespectNativeCodingAgentTelemetry:
      type: string
      description: 'Controls whether OpenTelemetry telemetry natively emitted by coding agents

        (e.g. Claude Code) is processed by Darkplane.


        - `disabled`: Native coding-agent telemetry is not processed by Darkplane.

        - `enabled`: Native coding-agent telemetry is processed by Darkplane.

        '
      enum:
      - disabled
      - enabled
    RetentionClass:
      type: string
      description: 'The retention class selected for a signal, per dataset. The value is the

        total retention in days, not an increase on top of a baseline.

        Customer-selectable signals (logs, spans, web events) expose the full

        set; non-selectable signals (metrics, profiling) keep their platform

        defaults.


        - `30d`: 30 days total (the included baseline).

        - `60d`: 60 days total.

        - `90d`: 90 days total.

        - `120d`: 120 days total.

        - `210d`: 210 days total.

        - `390d`: 390 days total.

        '
      enum:
      - 30d
      - 60d
      - 90d
      - 120d
      - 210d
      - 390d
    AttributeFilterAnyValue:
      description: AttributeFilterAnyValue may contain any AnyValue value.
      $ref: '#/components/schemas/AnyValue'
    SignalControlMeteringSettings:
      type: object
      description: 'Per-organization control over edge billing metering enforcement. Set centrally by Dash0

        and not customer-configurable.


        Deliberately a sibling of `signalControlEdge` rather than a field inside it: that object

        is a pre-release entitlement gate that goes away at GA, and enforcement has to outlive it.


        Every field is optional, and absence is meaningful — see `enforce`.

        '
      properties:
        enforce:
          type: boolean
          description: 'Whether edge collectors enforce billing metering for this organization.


            `true` enforces: Signal Control components on edge stop acting on telemetry that no

            metering processor marked, so a capability cannot run on usage nothing metered.


            `false` and an absent field both mean warn mode: the capabilities keep working on

            unmarked telemetry and the misconfiguration is only logged and reported. The two

            negatives are collapsed on purpose, so an organization can be returned to warn mode by

            writing `false` rather than by deleting a key, and an organization nobody has touched

            behaves identically to one explicitly parked.


            The collector''s compiled-in default is warn, permanently — enforcement is only ever

            something the server turns on. A collector that has never synced never enforces, but

            one that has been told to enforce keeps enforcing if it later loses contact.

            '
    SecretRef:
      type: object
      properties:
        id:
          type: string
          description: Opaque identifier of the encrypted secret.
        hash:
          type: string
          description: 'The hash is computed as follows:

            1. Parse the secrets JSON into a generic structure

            2. Recursively sort all object keys alphabetically (Unicode code point order)

            3. Re-serialize to compact JSON (no whitespace between tokens)

            4. Compute SHA-256 hash of the UTF-8 encoded JSON bytes

            5. Encode the hash as lowercase hexadecimal string


            This ensures the hash is stable and reproducible across different implementations.

            '
      required:
      - id
      - hash
    Error:
      properties:
        code:
          type: integer
          description: 'HTTP status code.

            '
        type:
          type: string
          description: 'Stable `snake_case` identifier for the kind of error, safe for clients to branch on. Not

            an enum: treat an unrecognized value the same as an absent one and fall back to `message`,

            so a new error kind never breaks the contract. Optional — absent means unclassified, not

            success.

            '
        message:
          type: string
          description: 'Human-readable description of the error. Safe to display.

            '
        traceId:
          type: string
          description: 'Trace ID for the request that produced the error, for correlating with logs and traces.

            '
      required:
      - code
      - message
    GenerativeAiEvaluationDisplay:
      properties:
        name:
          type: string
        description:
          description: Optional free-text note on what this evaluation judges and why. It carries no meaning for the judge itself; the rubric the model follows is the judge's prompts.
          type: string
      required:
      - name
    GenerativeAiEvaluationModel:
      type: string
      enum:
      - light
      - standard
      description: 'The model class used to judge an evaluation. Availability depends on the region and

        evaluation workload. Dash0 manages the serving model privately.


        - `light`: Fast, low-cost evaluations.

        - `standard`: Balanced quality and cost.

        '
    DarkplaneConfig:
      description: 'Darkplane-specific opt-ins for this dataset.

        '
      properties:
        respectNativeCodingAgentTelemetry:
          $ref: '#/components/schemas/RespectNativeCodingAgentTelemetry'
          description: 'Darkplane processing of OpenTelemetry telemetry natively emitted by coding agents.

            Defaults to `disabled` for new and existing datasets.

            '
    SettingsPerOrganizationAndDatasetInfo:
      type: object
      properties:
        technicalID:
          type: string
        signalControlEdge:
          $ref: '#/components/schemas/SignalControlEdgeSettings'
          description: 'SignalControl configuration for the organization. Always reports `enabled: true`

            since SignalControl is generally available.

            '
        signalControlMetering:
          $ref: '#/components/schemas/SignalControlMeteringSettings'
          description: 'Edge billing metering enforcement for the organization. Deliberately **not** in this

            schema''s `required` list, unlike `signalControlEdge`: an absent object means warn mode,

            so absence has to stay expressible. Requiring it would also force a backfill for every

            existing organization, which the rollout does not need — each one receives an explicit

            value by the end of the transition window.

            '
        signalControlOperationCardinalityReduction:
          $ref: '#/components/schemas/SignalControlOperationCardinalityReductionSettings'
          description: 'SaaS-side operation-name cardinality reduction for the organization. When `enabled` is

            false, the operation processor keeps its static behavior and runs no pattern matching or

            inference marking.

            '
        datasetSettings:
          type: array
          items:
            $ref: '#/components/schemas/DatasetSettings'
        timeSeriesAggregationSettings:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesAggregationDefinition'
        samplingSettings:
          type: array
          items:
            $ref: '#/components/schemas/SamplingDefinition'
        sourceMapSettings:
          type: array
          items:
            $ref: '#/components/schemas/SourceMapIntegration'
        signalToMetricsSettings:
          type: array
          items:
            $ref: '#/components/schemas/SignalToMetricsDefinition'
          description: 'Signal-to-metrics rules without `spec.output.type`, which every collector version

            understands.

            '
        telemetryTransformationRuleSettings:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryTransformationRuleDefinition'
        generativeAiEvaluationSettings:
          type: array
          items:
            $ref: '#/components/schemas/GenerativeAiEvaluationResponse'
        observedPatterns:
          type: array
          items:
            $ref: '#/components/schemas/ObservedPatternEntry'
      required:
      - technicalID
      - signalControlEdge
      - signalControlOperationCardinalityReduction
      - datasetSettings
      - timeSeriesAggregationSettings
      - samplingSettings
      - sourceMapSettings
      - signalToMetricsSettings
      - telemetryTransformationRuleSettings
      - generativeAiEvaluationSettings
    DatasetAction:
      type: string
      enum:
      - dataset:read
      - dataset:write
      - dataset:delete
      - dataset:createSyntheticCheck
      - dataset:createCheckRule
      - dataset:createRecordingRuleGroup
      - dataset:createSLO
      - dataset:createAgent0Automation
    SamplingSpec:
      properties:
        enabled:
          type: boolean
        display:
          $ref: '#/components/schemas/SamplingDisplay'
        conditions:
          $ref: '#/components/schemas/SamplingCondition'
        rateLimit:
          $ref: '#/components/schemas/SamplingRateLimit'
      required:
      - enabled
