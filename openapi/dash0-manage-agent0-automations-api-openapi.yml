    DarkplaneEvaluationTriggerVariableName:
      type: string
      enum:
      - darkplane.auto_approval.decision
      - darkplane.auto_approval.mode
      - darkplane.provider
      - darkplane.repository
      - darkplane.repository_id
      - darkplane.pull_request_id
      - darkplane.pull_request_number
      - darkplane.commit_sha
      - darkplane.auto_approval.evaluation_id
      - darkplane.auto_approval.score
      - darkplane.auto_approval.reasoning
      - darkplane.pull_request_url
      description: "Variables provided by the `darkplane.pull_request.evaluation` trigger. Optional evaluation\nfields are omitted when unavailable.\n\n- `darkplane.auto_approval.decision`: `approve` or `hold`, independent of whether approval\n  was applied.\n- `darkplane.auto_approval.mode`: The effective mode, one of `dry_run`, `auto_approve`, or\n  `auto_merge`.\n- `darkplane.provider`: The source control provider, `github` or `gitlab`.\n- `darkplane.repository`: Repository full name, including its owner or GitLab namespace.\n- `darkplane.repository_id`: Darkplane's internal repository ID, not the provider's.\n- `darkplane.pull_request_id`: Darkplane's internal pull request ID, not the\n  provider-facing number.\n- `darkplane.pull_request_number`: GitHub pull request number or GitLab merge request IID.\n- `darkplane.commit_sha`: The commit Darkplane evaluated, which may no longer be the head.\n- `darkplane.auto_approval.evaluation_id`: Darkplane's ID for this evaluation run.\n- `darkplane.auto_approval.score`: Weighted score from 0 to 100. Omitted when a hard gate\n  skipped scoring.\n- `darkplane.auto_approval.reasoning`: Darkplane's prose explanation of the verdict, in the\n  wording it writes on its own verdict comment. Branch on the decision, not on this.\n- `darkplane.pull_request_url`: Browser URL of the pull request or merge request.\n"
    Agent0SandboxProfileType:
      type: string
      enum:
      - default
      - custom
