    NetworkLevel:
      type: string
      enum:
      - no_network
      - trusted_only
      - full
      description: 'Controls outbound network access for the sandbox running this thread.

        - `no_network`: Block all outbound network access.

        - `trusted_only`: Allow outbound access only to a curated list of trusted addresses.

        - `full`: No network restrictions.

        '
    SlackReactionTriggerVariableName:
      type: string
      enum:
      - slack.reaction.emoji
      description: 'Additional variable provided only by the `slack_bot.reaction` trigger.


        - `slack.reaction.emoji`: The emoji name (without colons) that was added as a reaction.

        '
    GitHubReleaseAgenticWorkflowTrigger:
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/AgenticWorkflowTriggerKind'
          - enum:
            - github.release
        spec:
          $ref: '#/components/schemas/GitHubAgenticWorkflowTriggerSpec'
        delivery:
