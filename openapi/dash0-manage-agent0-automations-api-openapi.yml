          allOf:
          - $ref: '#/components/schemas/AgenticWorkflowTriggerKind'
          - enum:
            - darkplane.pull_request.evaluation
        spec:
          $ref: '#/components/schemas/DarkplanePullRequestEvaluationAgenticWorkflowTriggerSpec'
        delivery:
          $ref: '#/components/schemas/DarkplaneEvaluationTriggerDelivery'
          description: Must be omitted or `spawn`; Darkplane AutoMerge evaluations cannot continue a thread.
        task:
          $ref: '#/components/schemas/AgenticWorkflowTriggerTask'
      required:
      - kind
      - spec
    SlackBotFailedCheckAgenticWorkflowTrigger:
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/AgenticWorkflowTriggerKind'
          - enum:
            - slack_bot.failed_check.new
        spec:
          $ref: '#/components/schemas/SlackBotFailedCheckAgenticWorkflowTriggerSpec'
        task:
          $ref: '#/components/schemas/AgenticWorkflowTriggerTask'
      required:
      - kind
