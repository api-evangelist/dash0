    AgenticWorkflowTriggerTask:
      type: string
      description: 'Optional per-trigger task/instruction prompt. When set, it is rendered with the same

        `{{variable.name}}` substitution as `spec.prompt.user` and used as the task turn for

        invocations from this trigger: the kickoff framing when the trigger spawns a new agent,

        or the event framing when it continues an existing one. When omitted, the

        automation-level `spec.prompt.user` (on spawn) or a connector-default event summary (on

        continue) is used instead. The automation-level standing prompt is injected only once,

        on spawn, and is not re-sent on continue.

        '
    Agent0ReasoningEffort:
      type: string
      enum:
      - low
      - medium
      - high
      - xhigh
      - max
      description: "A reasoning-effort preference for Agent0 investigations, passed straight through to the\nunderlying model's own reasoning-effort parameter where the model supports one. Not every\nmodel class supports every level (a light-tier model, for example, supports none of them),\nso a level is only meaningful paired with a model class; see Agent0ModelSpec.\n- `low`: Minimal reasoning — fastest responses, lowest cost.\n- `medium`: The default balance of reasoning depth against latency and cost.\n- `high`: Deeper reasoning for problems the default balance underserves.\n- `xhigh`: Substantially more reasoning for complex, multi-step problems.\n- `max`: The deepest reasoning tier, for problems where correctness matters more than speed\n  or cost.\n"
    GitLabNoteAgenticWorkflowTrigger:
