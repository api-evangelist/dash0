    Agent0SandboxProfile:
      description: 'The resource source for an Agent0 sandbox. `type` is the discriminator: `default` carries no

        id and may carry the deployment resources resolved for a specific thread, `custom` carries all

        four resource fields and no id, and `catalog` carries an id that the control plane resolves to

        its resource snapshot. For a catalog profile, resource values sent by a client are ignored and

        replaced with the current catalog values.


        The resource fields are a snapshot, not a reference. Whatever selects a profile stores the

        whole object, so a thread keeps creating the sandbox it was created with even after the catalog

        entry behind it changes.


        `type` is temporarily optional for migration. A profile that omits it must carry `id` and is

        interpreted as `catalog`. New clients should always send `type`.

        '
      allOf:
      - $ref: '#/components/schemas/Agent0SandboxResources'
      - type: object
        properties:
          type:
            $ref: '#/components/schemas/Agent0SandboxProfileType'
          id:
            type: string
            description: The catalog profile to resolve. Only valid when `type` is `catalog`.
            minLength: 1
            maxLength: 100
          displayName:
            type: string
            description: Human-readable catalog profile name. Filled by the control plane on write.
          isWarmPooled:
            type: boolean
            description: 'Whether a sandbox on this catalog profile is normally served from the deployment''s

              warm pool and so starts without waiting for one to be provisioned. This is a catalog-only

              hint, not a promise. The field is returned by `GET /api/agent0/sandbox-profiles`, omitted

              from stored snapshots, and ignored on writes.

              '
    GitHubCheckActivityAgenticWorkflowTriggerSpec:
      allOf:
      - $ref: '#/components/schemas/GitHubAgenticWorkflowTriggerSpec'
      - type: object
        properties:
          branches:
            type: array
            items:
              type: string
            description: 'Optional list of branch names to filter on, matched against the check''s associated

              commit branch. When omitted, checks on any branch match.

              '
          branchRegex:
            type: string
            description: 'Optional RE2 regular expression matched against the complete branch name.

              Mutually exclusive with `branches`.

              '
    Agent0SandboxResources:
      type: object
      description: 'The resource shape one Agent0 sandbox is created with. Omitted fields fall back to the

        agents deployment''s own configured defaults.

        '
      properties:
        cpus:
          type: number
          description: Virtual CPUs reserved for the sandbox.
          minimum: 0
          exclusiveMinimum: true
        cpuLimit:
          type: number
          description: 'Hard limit on physical CPU cores, applied when the sandbox provider supports one. The

            sandbox bursts above `cpus` up to this. Never below `cpus`.

            '
          minimum: 0
          exclusiveMinimum: true
        memoryMiB:
          type: integer
          description: Memory reservation (request) for the sandbox, in MiB.
          minimum: 1
        memoryLimitMiB:
          type: integer
          description: 'Hard memory limit in MiB, applied when the sandbox provider supports one. This is the

            OOM guard the sandbox bursts up to. Never below `memoryMiB`.

            '
          minimum: 1
