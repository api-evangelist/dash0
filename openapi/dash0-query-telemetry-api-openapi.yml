openapi: 3.2.0
info:
  title: Dash0 Query Telemetry API
  version: 1.0.0
  description: '## Selecting a dataset


    Endpoints that operate on a single dataset take it from the `dataset` query parameter, or from the `Dash0-Dataset` request header when the query parameter is absent. When both are present the query parameter wins.


    If neither is given, the request falls back to the organization''s `default` dataset — a token that is restricted to specific datasets is rejected with `403 Forbidden` in that case, so always select a dataset explicitly when using a dataset-restricted token.


    ## Resource origins


    Most resources take an optional `metadata.labels["dash0.com/origin"]`. It is a stable identifier you choose for a resource you manage as code, so your Terraform configuration, Kubernetes manifests, CLI scripts or your own tooling can address the same resource on every apply without having to store the id Dash0 generated.


    An origin is unique per organization, not per dataset. Two resources of the same type in one organization cannot share an origin, even when they live in different datasets. If you want what is really the same rule in several datasets, put the dataset in the origin, for example `probabilistic-request-sampling-sandbox` and `probabilistic-request-sampling-nonprod`. The Dash0 Kubernetes operator does the same with the origins it generates. A duplicate origin is rejected with `400`.


    You cannot change an origin. Dash0 records it when the resource is created and ignores it on later updates, so you can read a resource, edit it and send it back without stripping the label out first.


    Endpoints with an `{originOrId}` path parameter take either identifier. A value that is not a UUID is read as an origin. A `PUT` to an origin that does not exist yet creates the resource with that origin, so you can apply the same manifest repeatedly.


    ## Request body size limit


    Most API endpoints enforce a maximum request body size of 256KB. Bulk

    endpoints accept a larger body size per request to accommodate batched

    payloads.


    Requests exceeding the applicable limit are rejected with a

    `413 Content Too Large` response.'
servers:
- url: https://api.eu-west-1.aws.dash0.com
  description: API endpoint for AWS region EU (Ireland)
- url: https://api.eu-central-1.aws.dash0.com
  description: API endpoint for AWS region EU (Germany)
- url: https://api.us-east-1.aws.dash0.com
  description: API endpoint for AWS region US (N. Virginia)
- url: https://api.us-west-2.aws.dash0.com
  description: API endpoint for AWS region US (Oregon)
- url: https://api.europe-west4.gcp.dash0.com
  description: API endpoint for GCP region EU (Netherlands)
tags:
- name: Query Telemetry
paths:
  /api/logs:
    post:
      summary: Returns OTLP logs records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetLogRecordsRequest'
      responses:
        '200':
          description: Returns log records in OTLP format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLogRecordsResponse'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Query Telemetry
      operationId: postApiLogs
      x-operation-id-source: derived
  /api/logs/download:
    post:
      summary: Download OTLP log records as a file
      description: 'Returns the log records matching the given query as a downloadable file in the

        requested format (`txt`, `ndjson`, `yaml` or `csv`).


        **A single export is capped at 5000 log records.** A `limit` above that cap is

        rejected rather than silently clamped: the response is a client error naming the cap.

        When the query matches more than 5000 records, the export carries the first 5000 in

        result-set order. Use the Dash0 CLI (`dash0 logs query`) to export larger volumes.


        The records are the same ones `POST /api/logs` returns for the same query, except that

        adaptive sampling is always disabled for exports: an exported file is never a sample,

        whatever the query and whatever the data volume.


        The response is streamed as pages are retrieved and therefore carries no

        `Content-Length`. Because the response headers are committed before the first record

        is written, a failure partway through cannot be reported as a status code — it

        terminates the transfer instead. Clients MUST confirm the body was received completely

        before treating the download as a successful export.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRecordsDownloadRequest'
      responses:
        '200':
          description: 'The exported log records. The body''s actual content type matches the requested

            format (`text/plain` for `txt`, `application/x-ndjson` for `ndjson`,

            `application/yaml` for `yaml`, `text/csv` for `csv`).

            '
          headers:
            Content-Type:
              schema:
                type: string
                example: text/csv
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="logs-2026-07-27T10-15-00Z.csv"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 'The request is invalid, for example a `limit` above the 5000-record cap or a time

            range exceeding the maximum permitted query range. No partial file is produced.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - the requested dataset is not accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Query Telemetry
      operationId: postApiLogsDownload
      x-operation-id-source: derived
  /api/spans:
    post:
      summary: Returns OTLP spans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSpansRequest'
      responses:
        '200':
          description: Returns spans in OTLP format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSpansResponse'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Query Telemetry
      operationId: postApiSpans
      x-operation-id-source: derived
  /api/spans/download:
    post:
      summary: Download OTLP spans as a file
      description: 'Returns the spans matching the given query as a downloadable file in the requested

        format (`txt`, `ndjson`, `yaml` or `csv`).


        **A single export is capped at 5000 spans.** A `limit` above that cap is rejected

        rather than silently clamped: the response is a client error naming the cap. When the

        query matches more than 5000 spans, the export carries the first 5000 in result-set

        order. Use the Dash0 CLI (`dash0 spans query`) to export larger volumes.


        The spans are the same ones `POST /api/spans` returns for the same query, except that

        adaptive sampling is always disabled for exports: an exported file is never a sample,

        whatever the query and whatever the data volume. This request accordingly takes no

        `sampling`, and one sent anyway is ignored.


        The response is streamed as pages are retrieved and therefore carries no

        `Content-Length`. Because the response headers are committed before the first span

        is written, a failure partway through cannot be reported as a status code — it

        terminates the transfer instead. Clients MUST confirm the body was received completely

        before treating the download as a successful export.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpansDownloadRequest'
      responses:
        '200':
          description: 'The exported spans. The body''s actual content type matches the requested

            format (`text/plain` for `txt`, `application/x-ndjson` for `ndjson`,

            `application/yaml` for `yaml`, `text/csv` for `csv`).

            '
          headers:
            Content-Type:
              schema:
                type: string
                example: text/csv
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="spans-2026-07-27T10-15-00Z.csv"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 'The request is invalid, for example a `limit` above the 5000-record cap, an

            unsupported ordering, or a time range exceeding the maximum permitted query

            range. No partial file is produced.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - the requested dataset is not accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Query Telemetry
      operationId: postApiSpansDownload
      x-operation-id-source: derived
  /api/trace/details:
    post:
      summary: Returns the OTLP spans and log records (if any) associated with the trace ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTraceRequest'
      responses:
        '200':
          description: Returns spans and log records (if any) in OTLP format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTraceResponse'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Query Telemetry
      operationId: postApiTraceDetails
      x-operation-id-source: derived
  /api/trace/ids:
    post:
      summary: Returns unique trace IDs matching the given filters
      description: 'Lightweight endpoint that returns only the unique trace IDs of traces containing

        at least one span matching the request filters. Useful for two-step workflows: first

        find matching trace IDs, then fetch full trace details via `GetTrace`

        (`POST /api/trace/details`). Significantly faster and lighter-weight than

        `GetSpans` (`POST /api/spans`) when only trace IDs are needed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTraceIdsRequest'
      responses:
        '200':
          description: Returns unique trace IDs as hex-encoded strings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTraceIdsResponse'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Query Telemetry
      operationId: postApiTraceIds
      x-operation-id-source: derived
  /api/web-events/download:
    post:
      summary: Download web events as a file
      description: 'Returns the web events matching the given query as a downloadable file in the

        requested format (`txt`, `ndjson`, `yaml` or `csv`).


        **A single export is capped at 5000 web events.** A `limit` above that cap is rejected

        rather than silently clamped: the response is a client error naming the cap. When the

        query matches more than 5000 events, the export carries the first 5000 in result-set

        order; there is no CLI equivalent for web events, so a larger export has to be taken

        as several narrower queries.


        The events are the same ones `POST /api/web-events` returns for the same query.

        Web-event retrieval does not sample, so no sampling has to be disabled for the file to

        be the query''s whole result set.


        The response is streamed as pages are retrieved and therefore carries no

        `Content-Length`. Because the response headers are committed before the first event

        is written, a failure partway through cannot be reported as a status code — it

        terminates the transfer instead. Clients MUST confirm the body was received completely

        before treating the download as a successful export.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebEventsDownloadRequest'
      responses:
        '200':
          description: 'The exported web events. The body''s actual content type matches the requested

            format (`text/plain` for `txt`, `application/x-ndjson` for `ndjson`,

            `application/yaml` for `yaml`, `text/csv` for `csv`).

            '
          headers:
            Content-Type:
              schema:
                type: string
                example: text/csv
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="web-events-2026-07-27T10-15-00Z.csv"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 'The request is invalid, for example a `limit` above the 5000-record cap, an

            unsupported ordering, or a time range exceeding the maximum permitted query

            range. No partial file is produced.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - the requested dataset is not accessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Query Telemetry
      operationId: postApiWebEventsDownload
      x-operation-id-source: derived
components:
  schemas:
    TimingAssertion:
      properties:
        kind:
          type: string
          enum:
          - timing
        spec:
          $ref: '#/components/schemas/TimingAssertionSpec'
      required:
      - kind
      - spec
    LogRecord:
      type: object
      properties:
        id:
          type: string
          description: 'The ID of the log record. This is a non-standard OTLP field. The property is only included when

            `includeOTLPSchemaExtensions` is `true`.

            '
        timeUnixNano:
          type: string
          format: uint64
        observedTimeUnixNano:
          type: string
          format: uint64
        eventName:
          type: string
        dash0EventId:
          type: string
          description: 'The ID of the log record. This is a non-standard OTLP field. The property is only included when

            `includeOTLPSchemaExtensions` is `true`.

            '
        severityNumber:
          $ref: '#/components/schemas/SeverityNumber'
        severityText:
          type: string
        body:
          $ref: '#/components/schemas/AnyValue'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'
        droppedAttributesCount:
          type: integer
          format: int64
        flags:
          type: integer
          format: int64
        traceId:
          type: string
          format: byte
        spanId:
          type: string
          format: byte
      required:
      - timeUnixNano
      - observedTimeUnixNano
      - attributes
    AnyValue:
      description: AnyValue is used to represent any type of attribute value. AnyValue may contain a primitive value such as a string or integer or it may contain an arbitrary nested object containing arrays, key-value lists and primitives.
      type: object
      properties:
        stringValue:
          type: string
        boolValue:
          type: boolean
        intValue:
          type: string
          format: int64
        doubleValue:
          type: number
          format: double
        bytesValue:
          type: string
          format: byte
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    ErrorAssertionSpec:
      properties:
        value:
          $ref: '#/components/schemas/SyntheticHttpErrorType'
      required:
      - value
    GetLogRecordsRequest:
      properties:
        filter:
          $ref: '#/components/schemas/FilterCriteria'
        timeRange:
          $ref: '#/components/schemas/TimeReferenceRange'
        dataset:
          $ref: '#/components/schemas/Dataset'
        sampling:
          $ref: '#/components/schemas/Sampling'
        ordering:
          $ref: '#/components/schemas/OrderingCriteria'
          description: 'The ordering criteria for the returned logs.

            Supported ordering key: `otel.log.time` (log timestamp, defaults to descending)

            '
        pagination:
          $ref: '#/components/schemas/CursorPagination'
          description: 'Cursor pagination for log records.

            - Maximum and default limit: 200 elements per page

            - We do not guarantee that the requested number of elements will be returned per page

            - Multiple pages may be required to retrieve the requested number of signals

            '
      required:
      - timeRange
    GetTraceIdsResponse:
      description: 'Response for the `GetTraceIds` API. Contains an array of unique trace IDs that match the

        request filters, ordered by the timestamp of their earliest matching span (descending).

        '
      properties:
        traceIds:
          description: 'Array of unique trace IDs as hex-encoded strings, ordered by the timestamp of each

            trace''s earliest matching span (descending).

            '
          type: array
          items:
            type: string
        cursors:
          $ref: '#/components/schemas/NextCursors'
          description: 'The cursors for the next sets of results. This property is included to support

            pagination through the result set when additional pages are available.

            '
      required:
      - traceIds
    InstrumentationScope:
      description: InstrumentationScope is a message representing the instrumentation scope information such as the fully qualified name and version.
      type: object
      properties:
        name:
          type: string
          description: An empty instrumentation scope name means the name is unknown.
        version:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'
          description: Additional attributes that describe the scope. [Optional]. Attribute keys MUST be unique (it is not allowed to have more than one attribute with the same key).
        droppedAttributesCount:
          type: integer
          format: int64
      required:
      - attributes
    GetSpansResponse:
      description: 'Response for the `GetSpans` API. The response contains the spans that match the request.


        This API deliberately reuses the full OTLP JSON format for spans. This is done to aid compatibility

        with existing OTLP consumers.

        '
      properties:
        executionTime:
          $ref: '#/components/schemas/FixedTime'
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        timeRange:
          $ref: '#/components/schemas/TimeRange'
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        cursors:
          $ref: '#/components/schemas/NextCursors'
          description: 'The cursors for the next sets of results. This property is included

            to support pagination through the result set when additional pages are available.

            '
        resourceSpans:
          description: 'There is one `ResourceSpan` per resource. This is aligned to the data most OTLP batching algorithms would

            produce, where there is one `ResourceSpan` per resource. This is done to aid compatibility with existing

            OTLP consumers.


            `Spans` nested in `ResourceSpans` are **ONLY** sorted if an explicit ordering has been defined. However,

            it is guaranteed that all data is sorted across paged requests.

            '
          type: array
          items:
            $ref: '#/components/schemas/ResourceSpans'
      required:
      - resourceSpans
    HttpResponseStatusCodeAssertion:
      properties:
        kind:
          type: string
          enum:
          - status_code
        spec:
          $ref: '#/components/schemas/HttpResponseStatusCodeAssertionSpec'
      required:
      - kind
      - spec
    TimeReference:
      x-go-type: any
      oneOf:
      - $ref: '#/components/schemas/FixedTime'
      - $ref: '#/components/schemas/FixedTimeUnix'
      - $ref: '#/components/schemas/RelativeTime'
    FixedTimeUnix:
      description: The time corresponding to the given unix time in seconds and nanoseconds (as decimal places) since January 1, 1970 UTC.
      type: string
    AttributeFilterKey:
      type: string
      description: The attribute key to be filtered.
    OrderingCriterion:
      description: Any combination of a supported key to order by and a direction.
      properties:
        key:
          $ref: '#/components/schemas/OrderingKey'
        direction:
          $ref: '#/components/schemas/OrderingDirection'
      required:
      - key
      - direction
    WebEventsDownloadRequest:
      description: 'Request for the `WebEventsDownload` API. Accepts the same query as `GetWebEvents`

        (`serviceName`, `eventNames`, `filter`, `timeRange`, `dataset`, `ordering`) and

        returns the matching web events serialized as a downloadable file rather than as a

        JSON page.


        The response is streamed, so the export is not paginated: a single request returns up

        to `limit` events, capped at 5000. Unlike the log and span exports there is no

        adaptive sampling to disable — web-event retrieval does not sample — so an exported

        file is the query''s whole result set up to the cap.


        There is no Dash0 CLI command for web events, so the cap is the only limit; a query

        matching more than 5000 events has to be narrowed to be exported in full.

        '
      properties:
        serviceName:
          type: string
        eventNames:
          type: array
          items:
            type: string
        filter:
          $ref: '#/components/schemas/FilterCriteria'
        timeRange:
          $ref: '#/components/schemas/TimeReferenceRange'
        dataset:
          $ref: '#/components/schemas/Dataset'
        ordering:
          $ref: '#/components/schemas/OrderingCriteria'
          description: 'The ordering criteria for the exported web events. Events are written to the file

            in this order.

            Supported ordering key: `otel.log.time` (event timestamp, defaults to descending),

            optionally followed by `dash0.web.event.id` ascending, which is the tiebreak

            web-event retrieval appends to keep its cursor stable.

            '
        format:
          $ref: '#/components/schemas/WebEventExportFormat'
        limit:
          type: integer
          format: int64
          default: 5000
          minimum: 1
          maximum: 5000
          description: 'The maximum number of web events to export. Defaults to, and is capped at, 5000.

            A larger value is rejected rather than silently clamped.

            '
        columns:
          type: array
          items:
            type: string
          description: 'Attribute keys to emit as columns, in order, for the `csv` format — resource,

            scope, or event attributes (e.g. `service.name`, `event.name`,

            `dash0.web.event.duration`). Ignored by the other formats, which have a fixed

            field set.

            '
      required:
      - timeRange
      - format
    HttpResponseHeaderAssertion:
      properties:
        kind:
          type: string
          enum:
          - response_header
        spec:
          $ref: '#/components/schemas/HttpResponseHeaderAssertionSpec'
      required:
      - kind
      - spec
    HttpResponseJsonBodyAssertionSpec:
      properties:
        jsonPath:
          type: string
        operator:
          $ref: '#/components/schemas/StringAssertionOperator'
        value:
          type: string
      required:
      - jsonPath
      - operator
      - value
    ResourceLanguages:
      type: array
      items:
        $ref: '#/components/schemas/ResourceLanguage'
    ResourceDeploymentEnvironment:
      type: string
      description: The value of the `deployment.environment.name` (or `deployment.environment` pre v1.27 semconvs)
    ResourceLogs:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/Resource'
        scopeLogs:
          type: array
          items:
            $ref: '#/components/schemas/ScopeLogs'
          minItems: 1
        schemaUrl:
          type: string
      required:
      - resource
      - scopeLogs
    ResourceOrchestration:
      type: string
      description: 'Resource orchestration identified based on orchestration related resource attributes, e.g., existence

        of `k8s.*` resource attribute.

        '
      enum:
      - kubernetes
    SslCertificateAssertionSpec:
      properties:
        value:
          $ref: '#/components/schemas/Duration'
      required:
      - value
    GetLogRecordsResponse:
      description: 'Response for the `GetLogRecords` API. The response contains the log records that match the request.


        This API deliberately reuses the full OTLP JSON format for logs. This is done to aid compatibility

        with existing OTLP consumers.

        '
      properties:
        executionTime:
          $ref: '#/components/schemas/FixedTime'
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        timeRange:
          $ref: '#/components/schemas/TimeRange'
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        cursors:
          $ref: '#/components/schemas/NextCursors'
          description: 'The cursors for the next sets of results. This property is included

            to support pagination through the result set when additional pages are available.

            '
        resourceLogs:
          description: 'There is one `ResourceLogs` per resource. This is aligned to the data most OTLP batching algorithms would

            produce, where there is one `ResourceLogs` per resource. This is done to aid compatibility with existing

            OTLP consumers.


            `ResourceLogs` are **NOT** sorted. There is no guarantee that `ResourceLogs` are sorted or that

            `LogRecord`s within them are sorted. However, it is guaranteed that all data is sorted across paged

            requests.


            Clients are advised to implement sorting within a page descending by the `LogRecord`''s `timeUnixNano`,

            `observedTimeUnixNano` and then `id`.

            '
          type: array
          items:
            $ref: '#/components/schemas/ResourceLogs'
      required:
      - resourceLogs
    FilterCriteria:
      type: array
      items:
        $ref: '#/components/schemas/AttributeFilter'
      example:
      - key: service.name
        operator: is
        value: foo
    AttributeFilterAnyValue:
      description: AttributeFilterAnyValue may contain any AnyValue value.
      $ref: '#/components/schemas/AnyValue'
    SpanExportFormat:
      type: string
      enum:
      - txt
      - ndjson
      - yaml
      - csv
      description: "The serialization format of the exported file.\n- `txt`: One rendered span line per record, carrying a fixed field set of start\n  timestamp, service, span name, duration, kind, status code, trace ID and span ID.\n  Ignores `columns`.\n- `ndjson`: One OTLP JSON payload per line, each carrying a single span inside the\n  same `resourceSpans` envelope `GetSpans` returns, so each line is independently\n  parseable by any OTLP JSON consumer.\n- `yaml`: The same per-span OTLP payloads as `ndjson`, as a multi-document YAML\n  stream with documents separated by `---`.\n- `csv`: A header row plus one row per span, flattened to the requested `columns`.\n"
    Error:
      properties:
        code:
          type: integer
          description: 'HTTP status code.

            '
        type:
          type: string
          description: 'Stable `snake_case` identifier for the kind of error, safe for clients to branch on. Not

            an enum: treat an unrecognized value the same as an absent one and fall back to `message`,

            so a new error kind never breaks the contract. Optional — absent means unclassified, not

            success.

            '
        message:
          type: string
          description: 'Human-readable description of the error. Safe to display.

            '
        traceId:
          type: string
          description: 'Trace ID for the request that produced the error, for correlating with logs and traces.

            '
      required:
      - code
      - message
    TimingAssertionSpec:
      properties:
        type:
          $ref: '#/components/schemas/TimingType'
        operator:
          $ref: '#/components/schemas/NumericAssertionOperator'
        value:
          $ref: '#/components/schemas/Duration'
      required:
      - type
      - operator
      - value
    HttpResponseJsonBodyAssertion:
      properties:
        kind:
          type: string
          enum:
          - json_body
        spec:
          $ref: '#/components/schemas/HttpResponseJsonBodyAssertionSpec'
      required:
      - kind
      - spec
    SyntheticCheckAttemptDetails:
      allOf:
      - $ref: '#/components/schemas/SyntheticCheckAttempt'
      - type: object
        properties:
          spanAttributes:
            type: array
            items:
              $ref: '#/components/schemas/KeyValue'
            description: Span attributes using OTLP KeyValue format
          events:
            type: array
            items:
              $ref: '#/components/schemas/SpanEvent'
            description: Span events using OTLP SpanEvent format
        required:
        - spanAttributes
        - events
    AttributeFilter:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/AttributeFilterKey'
        operator:
          $ref: '#/components/schemas/AttributeFilterOperator'
        value:
          oneOf:
          - $ref: '#/components/schemas/AttributeFilterStringValue'
          - $ref: '#/components/schemas/AttributeFilterAnyValue'
        values:
          type: array
          description: 'List of values to match against. This parameter is mandatory for the is_one_of and is_not_one_of operators.

            '
          items:
            oneOf:
            - $ref: '#/components/schemas/AttributeFilterStringValue'
            - $ref: '#/components/schemas/AttributeFilterAnyValue'
      required:
      - key
      - operator
    SyntheticHttpErrorType:
      type: string
      description: '`location_unavailable` marks a run that was never dispatched because its location could not run it. It is reported on results only and is rejected in error assertions.'
      enum:
      - unknown
      - dns
      - tcp
      - tls
      - timeout
      - location_unavailable
    LogRecordExportFormat:
      type: string
      enum:
      - txt
      - ndjson
      - yaml
      - csv
      description: "The serialization format of the exported file.\n- `txt`: One rendered log line per record, carrying a fixed field set of timestamp,\n  severity, resource, body and trace ID. Ignores `columns`.\n- `ndjson`: One OTLP JSON payload per line, each carrying a single log record inside\n  the same `resourceLogs` envelope `GetLogRecords` returns, so each line is\n  independently parseable by any OTLP JSON consumer.\n- `yaml`: The same per-record OTLP payloads as `ndjson`, as a multi-document YAML\n  stream with documents separated by `---`.\n- `csv`: A header row plus one row per record, flattened to the requested `columns`.\n"
    KeyValue:
      description: KeyValue is a key-value pair that is used to store Span attributes, Link attributes, etc.
      type: object
      properties:
        key:
          type: string
        value:
          $ref: '#/components/schemas/AnyValue'
      required:
      - key
      - value
    LogRecordsDownloadRequest:
      description: 'Request for the `LogRecordsDownload` API. Accepts the same query as `GetLogRecords`

        (`filter`, `timeRange`, `dataset`, `ordering`) and returns the matching records

        serialized as a downloadable file rather than as a JSON page.


        The response is streamed, so the export is not paginated: a single request returns up

        to `limit` records, capped at 5000. Adaptive sampling is always disabled for exports,

        so an exported file is never a sample.

        '
      properties:
        filter:
          $ref: '#/components/schemas/FilterCriteria'
        timeRange:
          $ref: '#/components/schemas/TimeReferenceRange'
        dataset:
          $ref: '#/components/schemas/Dataset'
        ordering:
          $ref: '#/components/schemas/OrderingCriteria'
          description: 'The ordering criteria for the exported logs. Records are written to the file in

            this order.

            Supported ordering key: `otel.log.time` (log timestamp, defaults to descending)

            '
        format:
          $ref: '#/components/schemas/LogRecordExportFormat'
        limit:
          type: integer
          format: int64
          default: 5000
          minimum: 1
          maximum: 5000
          description: 'The maximum number of log records to export. Defaults to, and is capped at, 5000.

            A larger value is rejected rather than silently clamped. Use the Dash0 CLI

            (`dash0 logs query`) to export volumes beyond this cap.

            '
        columns:
          type: array
          items:
            type: string
          description: 'Attribute keys to emit as columns, in order, for the `csv` format — resource,

            scope, or log record attributes (e.g. `service.name`, `otel.log.body`). Ignored by

            the other formats, which have a fixed field set.

            '
      required:
      - timeRange
      - format
    RelativeTime:
      type: string
      pattern: ^now.*$
      description: 'A relative time reference based on the current time ("now").


        **Format**: `now[+/-duration]`


        **Examples**:

        - `now` - current time

        - `now-30m` - 30 minutes ago

        - `now-1h` - 1 hour ago

        - `now-1d` - 1 day ago


        **Duration Units**:

        - `s` - seconds

        - `m` - minutes

        - `h` - hours

        - `d` - days

        - `w` - weeks

        - `M` - months

        '
    GetTraceIdsRequest:
      description: 'Request to retrieve unique trace IDs of traces that contain at least one span matching the

        given filters. This is a lightweight alternative to `GetSpans` for two-step workflows where

        only trace IDs are needed first, and full trace details are subsequently retrieved via

        `GetTrace` (`POST /api/trace/details`).

        '
      properties:
        filter:
          $ref: '#/components/schemas/FilterCriteria'
        timeRange:
          $ref: '#/components/schemas/TimeReferenceRange'
        dataset:
          $ref: '#/components/schemas/Dataset'
        sampling:
          $ref: '#/components/schemas/Sampling'
        ordering:
          $ref: '#/components/schemas/OrderingCriteria'
          description: 'The ordering criteria for the returned trace IDs. Only `otel.trace.start_time` descending

            is supported (this is also the default when omitted). Any other key, ascending direction,

            or multiple criteria will be rejected with a 400 response. A trace''s start time is the

            timestamp of its earliest matching span; trace IDs are returned ordered by that value.

            '
        pagination:
          $ref: '#/components/schemas/CursorPagination'
          description: 'Cursor pagination for trace IDs.

            - Maximum and default limit: 5000 elements per page

            - Multiple pages may be required to retrieve all matching trace IDs

            '
      required:
      - timeRange
    Sampling:
      properties:
        mode:
          $ref: '#/components/schemas/SamplingMode'
        timeRange:
          $ref: '#/components/schemas/TimeReferenceRange'
          description: 'The global time range. We need this to differentiate between a local time selection, e.g., in the heat map, and the global

            time selection that is defining the sampling decision. We do this so that a selection in the heat map (which is based off

            the global time range) and the span list (which is based on the heat map selected time range) show consistent results.


            Without this, it could be that an a selection of an empty area in the heat map produces results in the span list.

            '
      required:
      - mode
      - timeRange
    SyntheticCheckAttempt:
      properties:
        syntheticCheckId:
          type: string
          description: ID of the synthetic check
        syntheticCheckVersion:
          type: string
          description: Version of the synthetic check
        runId:
          type: string
          description: (Internal) Run ID this attempt belongs to
          x-internal: true
        location:
          $ref: '#/components/schemas/SyntheticCheckLocation'
          description: The geographic location from which the check was executed.
        attemptId:
          type: string
          description: (Internal) Unique identifier for the attempt
          x-internal: true
        isTestRun:
          type: boolean
          description: (Internal) Whether this attempt was triggered as a test run
          x-internal: true
        traceId:
          type: string
          format: byte
          description: (Internal) Trace ID associated with this attempt
          x-internal: true
        spanId:
          type: string
          format: byte
          description: (Internal) Span ID associated with this attempt
          x-internal: true
        startTime:
          $ref: '#/components/schemas/FixedTime'
        duration:
          type: integer
          format: int64
          description: duration in nanoseconds
        statusCode:
          type: integer
          description: HTTP status code
        errorType:
          $ref: '#/components/schemas/SyntheticHttpErrorType'
          description: Error type of the synthetic check attempt, if any
        errorMessage:
          type: string
          description: Error message of the synthetic check attempt, if any
        failedCriticalAssertions:
          type: array
          items:
            $ref: '#/components/schemas/FailedHttpCheckAssertion'
          description: List of critical assertions that failed
        failedDegradedAssertions:
          type: array
          items:
            $ref: '#/components/schemas/FailedHttpCheckAssertion'
          description: List of degraded assertions that failed
        passedCriticalAssertions:
          type: array
          items:
            $ref: '#/components/schemas/HttpCheckAssertion'
          description: List of critical assertions that passed
        passedDegradedAssertions:
          type: array
          items:
            $ref: '#/components/schemas/HttpCheckAssertion'
          description: List of degraded assertions that passed
      required:
      - syntheticCheckId
      - syntheticCheckVersion
      - runId
      - attemptId
      - isTestRun
      - location
      - traceId
      - spanId
      - startTime
      - duration
      - statusCode
      - failedCriticalAssertions
      - failedDegradedAssertions
      - passedCriticalAssertions
      - passedDegradedAssertions
    FailedHttpCheckAssertion:
      description: Information about a failed HTTP check assertion
      properties:
        assertion:
          $ref: '#/components/schemas/HttpCheckAssertion'
          description: The assertion that
        actualValue:
          type: string
          description: The actual value that was received in the response
        explanation:
          type: string
          description: A human-readable message explaining why the assertion failed
      required:
      - assertion
      - explanation
    SamplingMode:
      type: string
      enum:
      - adaptive
      - disabled
    HttpResponseTextBodyAssertionSpec:
      properties:
        operator:
          $ref: '#/components/schemas/StringAssertionOperator'
        value:
          type: string
      required:
      - operator
      - value
    GetTraceResponse:
      description: 'Response for the `GetTrace` API. The response contains the spans and logs that match the request.


        This API deliberately reuses the full OTLP JSON format for spans and logs. This is done to aid compatibility

        with existing OTLP consumers.

        '
      properties:
        resourceSpans:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSpans'
        resourceLogs:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLogs'
        webEvents:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLogs'
          minItems: 0
          maxItems: 1
        syntheticCheckAttemptDetails:
          $ref: '#/components/schemas/SyntheticCheckAttemptDetails'
        additionalResourceSpans:
          type: array
          description: 'Resource spans from linked traces. Only populated when includeLinkedTraces=true.

            '
          items:
            $ref: '#/components/schemas/ResourceSpans'
      required:
      - resourceSpans
      - resourceLogs
      - webEvents
    Resource:
      type: object
      properties:
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'
        droppedAttributesCount:
          type: integer
          format: int64
        firstSeenUnixNano:
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
          type: string
          format: uint64
        lastSeenUnixNano:
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
          type: string
          format: uint64
        operationTypes:
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
          type: array
          items:
            type: string
        deploymentEnvironments:
          $ref: '#/components/schemas/ResourceDeploymentEnvironments'
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        languages:
          $ref: '#/components/schemas/ResourceLanguages'
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        orchestrations:
          $ref: '#/components/schemas/ResourceOrchestrations'
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        clouds:
          $ref: '#/components/schemas/ResourceClouds'
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
      required:
      - attributes
    Span:
      type: object
      properties:
        traceId:
          type: string
          format: byte
        spanId:
          type: string
          format: byte
        traceState:
          type: string
        parentSpanId:
          type: string
          format: byte
        hasChildren:
          type: boolean
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        flags:
          type: integer
          format: int64
        name:
          type: string
        dash0Name:
          type: string
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        dash0TraceOriginType:
          type: string
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        dash0TraceOriginParentSpanId:
          type: string
          format: byte
          description: The property is only included when `includeOTLPSchemaExtensions` is `true`.
        dash0ForwardLinks:
          type: array
          description: 'Forward links pointing to spans in other traces.

            The property is only included when `includeOTLPSchemaExtensions` is `true`.

            '
          items:
            $ref: '#/components/schemas/SpanLink'
        kind:
          $ref: '#/components/schemas/SpanKind'
        startTimeUnixNano:
          type: string
          format: uint64
        endTimeUnixNano:
          type: string
          format: uint64
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'
        droppedAttributesCount:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: '#/components/schemas/SpanEvent'
        droppedEventsCount:
          type: integer
          format: int64
        links:
          type: array
          items:
            $ref: '#/components/schemas/SpanLink'
        droppedLinksCount:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SpanStatus'
      required:
      - traceId
      - spanId
      - name
      - attributes
      - events
      - links
      - status
      - startTimeUnixNano
      - endTimeUnixNano
      - kind
    TimeReferenceRange:
      description: 'A range of time between two time references.

        '
      properties:
        from:
          $ref: '#/components/schemas/TimeReference'
        to:
          $ref: '#/components/schemas/TimeReference'
      required:
      - from
      - to
      example:
        from: now-30m
        to: now
    SpanLink:
      type: object
      properties:
        traceId:
          type: string
          format: byte
        spanId:
          type: string
          format: byte
        traceState:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'
        droppedAttributesCount:
          type: integer
          format: int64
        flags:
          type: integer
          format: int64
      required:
      - traceId
      - spanId
      - attributes
    Dataset:
      type: string
      pattern: ^[a-zA-Z0-9_-]{3,26}$
      description: Optional dataset to query across. Defaults to whatever is configured to be the default dataset for the organization.
    GetSpansRequest:
      properties:
        filter:
          $ref: '#/components/schemas/FilterCriteria'
        timeRange:
          $ref: '#/components/schemas/TimeReferenceRange'
        dataset:
          $ref: '#/components/schemas/Dataset'
        sampling:
          $ref: '#/components/schemas/Sampling'
        ordering:
          $ref: '#/components/schemas/OrderingCriteria'
          description: 'The ordering criteria for the returned spans.

            Supported ordering key: `otel.span.start_time` (span start timestamp, defaults to descending)

            '
        pagination:
          $ref: '#/components/schemas/CursorPagination'
          description: 'Cursor pagination for spans.

            - Maximum and default limit: 200 elements per page

            - We do not guarantee that the requested number of elements will be returned per page

            - Multiple pages may be required to retrieve the requested number of signals

            '
      required:
      - timeRange
    FixedTime:
      type: string
      format: date-time
      description: 'A fixed point in time represented as an RFC 3339 date-time string.


        **Format**: `YYYY-MM-DDTHH:MM:SSZ` (UTC) or `YYYY-MM-DDTHH:MM:SS±HH:MM` (with timezone offset)


        **Examples**:

        - `2024-01-15T14:30:00Z`

        - `2024-01-15T14:30:00+08:00`

        '
    Duration:
      type: string
      pattern: (\d+(ms|s|m|h|d|w|M|Q|y))+
    NextCursors:
      properties:
        before:
          $ref: '#/components/schemas/Cursor'
          description: 'The cursor for the previous set of results. Omitted when there are no more results before —

            the field is absent rather than null, so a client must treat it as optional and never as

            nullable.

            '
        after:
          $ref: '#/components/schemas/Cursor'
          description: 'The cursor for the next set of results. Omitted when there are no more results after —

            the field is absent rather than null, so a client must treat it as optional and never as

            nullable.


            Whether the enclosing `cursors` object is itself omitted on the last page depends on the

            endpoint: some declare it optional and drop it, others declare it required and send it

            empty. Read the endpoint''s own schema rather than assuming either.

            '
    SpanStatusCode:
      type: integer
      format: int32
      description: '// The default status.

        STATUS_CODE_UNSET               = 0;

        // The Span has been validated by an Application developer or Operator to

        // have completed successfully.

        STATUS_CODE_OK                  = 1;

        // The Span contains an error.

        STATUS_CODE_ERROR               = 2;

        '
      default: 0
    ScopeLogs:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/InstrumentationScope'
        logRecords:
          type: array
          items:
            $ref: '#/components/schemas/LogRecord'
          minItems: 1
        schemaUrl:
          type: string
      required:
      - logRecords
    CursorPagination:
      description: 'Cursor pagination is a technique for paging through a result set using a cursor. It is

        similar to offset pagination except that the cursor is an opaque value that encodes the

        position within the result set. This allows for fetching the next page of results from

        the current position without having to skip over a potentially large number of rows.


        It is also more resilient against late-arriving data which otherwise would cause issues

        with offset pagination. For example, if a row is inserted between two pages of results

        then the second page would contain a duplicate row and the third page would be missing.

        '
      properties:
        cursor:
          $ref: '#/components/schemas/Cursor'
        limit:
          type: integer
          format: int64
          description: 'The maximum number of results to return. If not set, there is a default limit to the number of results returned.

            '
          example: 10
    SyntheticCheckLocation:
      type: string
      description: 'Where a synthetic check runs from: a public region identifier, or a private location''s

        Dash0-assigned id or its `locationId`. Stored as written.

        '
      minLength: 1
      maxLength: 128
    ResourceCloud:
      type: string
      description: 'Resource cloud identified based on the `cloud.provider` resource attribute. Some sample values:

        - alibaba_cloud

        - aws

        - azure

        - gcp

        - heroku

        - ibm_cloud

        - tencent_cloud

        '
    HttpResponseTextBodyAssertion:
      properties:
        kind:
          type: string
          enum:
          - text_body
        spec:
          $ref: '#/components/schemas/HttpResponseTextBodyAssertionSpec'
      required:
      - kind
      - spec
    HttpCheckAssertion:
      anyOf:
      - $ref: '#/components/schemas/HttpResponseStatusCodeAssertion'
      - $ref: '#/components/schemas/HttpResponseHeaderAssertion'
      - $ref: '#/components/schemas/HttpResponseJsonBodyAssertion'
      - $ref: '#/components/schemas/HttpResponseTextBodyAssertion'
      - $ref: '#/components/schemas/TimingAssertion'
      - $ref: '#/components/schemas/ErrorAssertion'
      - $ref: '#/components/schemas/SslCertificateAssertion'
    ScopeSpans:
      type: object
      properties:
        scope:
          $ref: '#/components/schemas/InstrumentationScope'
        spans:
          type: array
          items:
            $ref: '#/components/schemas/Span'
          minItems: 1
        schemaUrl:
          type: string
      required:
      - spans
    ResourceOrchestrations:
      type: array
      items:
        $ref: '#/components/schemas/ResourceOrchestration'
    HttpResponseHeaderAssertionSpec:
      properties:
        key:
          type: string
        operator:
          $ref: '#/components/schemas/StringAssertionOperator'
        value:
          type: string
      required:
      - key
      - operator
      - value
    OrderingCriteria:
      type: array
      description: Any supported attribute keys to order by.
      items:
        $ref: '#/components/schemas/OrderingCriterion'
    OrderingKey:
      type: string
      description: Any attribute key to order by.
    ResourceDeploymentEnvironments:
      type: array
      items:
        $ref: '#/components/schemas/ResourceDeploymentEnvironment'
    HttpResponseStatusCodeAssertionSpec:
      properties:
        operator:
          $ref: '#/components/schemas/NumericAssertionOperator'
        value:
          type: string
      required:
      - operator
      - value
    TimingType:
      type: string
      enum:
      - total
      - dns
      - connection
      - ssl
      - request
      - response
    OrderingDirection:
      type: string
      enum:
      - ascending
      - descending
      default: ascending
    SeverityNumber:
      type: integer
      format: int32
      description: 'SEVERITY_NUMBER_UNSPECIFIED = 0;

        SEVERITY_NUMBER_TRACE  = 1;

        SEVERITY_NUMBER_TRACE2 = 2;

        SEVERITY_NUMBER_TRACE3 = 3;

        SEVERITY_NUMBER_TRACE4 = 4;

        SEVERITY_NUMBER_DEBUG  = 5;

        SEVERITY_NUMBER_DEBUG2 = 6;

        SEVERITY_NUMBER_DEBUG3 = 7;

        SEVERITY_NUMBER_DEBUG4 = 8;

        SEVERITY_NUMBER_INFO   = 9;

        SEVERITY_NUMBER_INFO2  = 10;

        SEVERITY_NUMBER_INFO3  = 11;

        SEVERITY_NUMBER_INFO4  = 12;

        SEVERITY_NUMBER_WARN   = 13;

        SEVERITY_NUMBER_WARN2  = 14;

        SEVERITY_NUMBER_WARN3  = 15;

        SEVERITY_NUMBER_WARN4  = 16;

        SEVERITY_NUMBER_ERROR  = 17;

        SEVERITY_NUMBER_ERROR2 = 18;

        SEVERITY_NUMBER_ERROR3 = 19;

        SEVERITY_NUMBER_ERROR4 = 20;

        SEVERITY_NUMBER_FATAL  = 21;

        SEVERITY_NUMBER_FATAL2 = 22;

        SEVERITY_NUMBER_FATAL3 = 23;

        SEVERITY_NUMBER_FATAL4 = 24;

        '
      default: 0
    TimeRange:
      properties:
        from:
          $ref: '#/components/schemas/FixedTime'
        to:
          $ref: '#/components/schemas/FixedTime'
      required:
      - from
      - to
    Cursor:
      type: string
      description: 'The cursor to another set of results. The value of this field is opaque to the

        client and may be used as a parameter to the next request to get the another set of results.

        Cursors do not implement any ordering.

        '
    WebEventExportFormat:
      type: string
      enum:
      - txt
      - ndjson
      - yaml
      - csv
      description: "The serialization format of the exported file.\n- `txt`: One rendered line per web event, carrying a fixed field set of timestamp,\n  service, event name, title, duration and trace ID. Ignores `columns`.\n- `ndjson`: One OTLP JSON payload per line, each carrying a single web event inside\n  the same `resourceLogs` envelope `GetWebEvents` returns — web events are stored as\n  OTLP log records — so each line is independently parseable by any OTLP JSON\n  consumer.\n- `yaml`: The same per-event OTLP payloads as `ndjson`, as a multi-document YAML\n  stream with documents separated by `---`.\n- `csv`: A header row plus one row per web event, flattened to the requested `columns`.\n"
    AttributeFilterStringValue:
      description: AttributeFilterStringValue may contain a primitive value such as a regex pattern or string.
      type: string
    SslCertificateAssertion:
      properties:
        kind:
          type: string
          enum:
          - ssl_certificate
        spec:
          $ref: '#/components/schemas/SslCertificateAssertionSpec'
      required:
      - kind
      - spec
    GetTraceRequest:
      properties:
        dataset:
          $ref: '#/components/schemas/Dataset'
        traceId:
          type: string
        timeRange:
          $ref: '#/components/schemas/TimeReferenceRange'
          description: 'Optional time range hint to bound the trace metadata lookup. When provided, the backend

            restricts the `AggregatedTraceMetadata` query to this window (with a small buffer) and

            will not fall back to a full-table scan. When absent, the backend uses a default short

            window with a full-scan fallback for backward compatibility — this fallback can be

            expensive on large datasets. API consumers are strongly encouraged to provide a

            `timeRange` covering when the trace occurred.

            '
        includeLinkedTraces:
          type: boolean
          description: 'If true, recursively fetches all traces referenced via forward links (dash0ForwardLinks)

            and returns them in `additionalResourceSpans`. Implies includeOTLPSchemaExtensions=true.

            '
          default: false
      required:
      - traceId
    ResourceLanguage:
      type: string
      description: 'Resource language identified based on the `telemetry.sdk.language` resource attribute. Some sample values:

        - cpp

        - dotnet

        - erlang

        - go

        - java

        - nodejs

        - php

        - python

        - ruby

        - rust

        - swift

        - webjs

        '
    SpanEvent:
      type: object
      properties:
        timeUnixNano:
          type: string
          format: uint64
        name:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'
        droppedAttributesCount:
          type: integer
          format: int64
      required:
      - timeUnixNano
      - name
      - attributes
    StringAssertionOperator:
      type: string
      enum:
      - is
      - is_not
      - is_set
      - is_not_set
      - is_one_of
      - is_not_one_of
      - matches
      - does_not_match
      - contains
      - does_not_contain
      - starts_with
      - does_not_start_with
      - ends_with
      - does_not_end_with
    SpansDownloadRequest:
      description: 'Request for the `SpansDownload` API. Accepts the same query as `GetSpans`

        (`filter`, `timeRange`, `dataset`, `ordering`) and returns the matching spans

        serialized as a downloadable file rather than as a JSON page.


        The response is streamed, so the export is not paginated: a single request returns up

        to `limit` spans, capped at 5000. Adaptive sampling is always disabled for exports,

        so an exported file is never a sample. Unlike `GetSpans` this request therefore takes

        no `sampling`, and one sent anyway is ignored: the sampling path can substitute a

        duration-percentile filter and quietly change which spans the file contains, so

        exports never take it.

        '
      properties:
        filter:
          $ref: '#/components/schemas/FilterCriteria'
        timeRange:
          $ref: '#/components/schemas/TimeReferenceRange'
        dataset:
          $ref: '#/components/schemas/Dataset'
        ordering:
          $ref: '#/components/schemas/OrderingCriteria'
          description: 'The ordering criteria for the exported spans. Spans are written to the file in

            this order.

            Supported ordering key: `otel.span.start_time` (span start timestamp, defaults to

            descending), optionally followed by `otel.trace.id` then `otel.span.id` ascending,

            which is the tiebreak span retrieval appends to keep its cursor stable.

            '
        format:
          $ref: '#/components/schemas/SpanExportFormat'
        limit:
          type: integer
          format: int64
          default: 5000
          minimum: 1
          maximum: 5000
          description: 'The maximum number of spans to export. Defaults to, and is capped at, 5000.

            A larger value is rejected rather than silently clamped. Use the Dash0 CLI

            (`dash0 spans query`) to export volumes beyond this cap.

            '
        columns:
          type: array
          items:
            type: string
          description: 'Attribute keys to emit as columns, in order, for the `csv` format — resource,

            scope, or span attributes (e.g. `service.name`, `otel.span.duration`). Ignored by

            the other formats, which have a fixed field set.

            '
      required:
      - timeRange
      - format
    ResourceClouds:
      type: array
      items:
        $ref: '#/components/schemas/ResourceCloud'
    SpanStatus:
      type: object
      properties:
        message:
          type: string
          description: A developer-facing human readable error message.
        code:
          $ref: '#/components/schemas/SpanStatusCode'
      required:
      - code
    NumericAssertionOperator:
      type: string
      enum:
      - is
      - is_not
      - gt
      - lt
      - gte
      - lte
      - is_one_of
      - is_not_one_of
    AttributeFilterOperator:
      type: string
      enum:
      - is
      - is_not
      - is_set
      - is_not_set
      - is_one_of
      - is_not_one_of
      - gt
      - lt
      - gte
      - lte
      - matches
      - does_not_match
      - contains
      - does_not_contain
      - starts_with
      - does_not_start_with
      - ends_with
      - does_not_end_with
      - is_any
      description: 'The match operation for filtering attributes.


        #### Equality Operators

        - `is` - equals (attribute exists and has a matching value)

        - `is_not` - not equals (attribute exists and has a different value)


        #### Existence Operators

        - `is_set` - is set (attribute exists)

        - `is_not_set` - is not set (attribute does not exist)


        #### Multiple Value Operators

        - `is_one_of` - is any of (attribute exists and has a value that is in the specified values)

        - `is_not_one_of` - is not any of (attribute exists and has a value that is not in the specified values)


        #### Comparison Operators

        - `gt` - greater than

        - `lt` - less than

        - `gte` - greater than or equal

        - `lte` - less than or equal


        #### Pattern Matching Operators

        - `matches` - match regex expression (attribute exists and matches the regular expression)

        - `does_not_match` - does not match regex expression (attribute exists and does not match the regular expression)


        #### String Operators

        - `contains` - contains (attribute exists and contains the specified value)

        - `does_not_contain` - does not contain (attribute exists and does not contain the specified value)

        - `starts_with` - starts with (attribute exists and starts with the specified value)

        - `does_not_start_with` - does not start with (attribute exists and does not start with the specified value)

        - `ends_with` - ends with (attribute exists and ends with the specified value)

        - `does_not_end_with` - does not end with (attribute exists and does not end with the specified value)


        #### Special Operators

        - `is_any` - matches any value, ignoring whether the key exists or not

        '
    ResourceSpans:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/Resource'
        scopeSpans:
          type: array
          items:
            $ref: '#/components/schemas/ScopeSpans'
          minItems: 1
        schemaUrl:
          type: string
      required:
      - resource
      - scopeSpans
    SpanKind:
      type: integer
      format: int32
      description: '// Unspecified. Do NOT use as default.

        // Implementations MAY assume SpanKind to be INTERNAL when receiving UNSPECIFIED.

        SPAN_KIND_UNSPECIFIED = 0;


        // Indicates that the span represents an internal operation within an application,

        // as opposed to an operation happening at the boundaries. Default value.

        SPAN_KIND_INTERNAL = 1;


        // Indicates that the span covers server-side handling of an RPC or other

        // remote network request.

        SPAN_KIND_SERVER = 2;


        // Indicates that the span describes a request to some remote service.

        SPAN_KIND_CLIENT = 3;


        // Indicates that the span describes a producer sending a message to a broker.

        // Unlike CLIENT and SERVER, there is often no direct critical path latency relationship

        // between producer and consumer spans. A PRODUCER span ends when the message was accepted

        // by the broker while the logical processing of the message might span a much longer time.

        SPAN_KIND_PRODUCER = 4;


        // Indicates that the span describes consumer receiving a message from a broker.

        // Like the PRODUCER kind, there is often no direct critical path latency relationship

        // between producer and consumer spans.

        SPAN_KIND_CONSUMER = 5;

        '
      default: 0
    ErrorAssertion:
      properties:
        kind:
          type: string
          enum:
          - error
        spec:
          $ref: '#/components/schemas/ErrorAssertionSpec'
      required:
      - kind
      - spec
