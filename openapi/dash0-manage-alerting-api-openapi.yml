openapi: 3.2.0
info:
  title: Dash0 Manage Alerting API
  version: 1.0.0
  description: '## Selecting a dataset


    Endpoints that operate on a single dataset take it from the `dataset` query parameter, or from the `Dash0-Dataset` request header when the query parameter is absent. When both are present the query parameter wins.


    If neither is given, the request falls back to the organization''s `default` dataset — a token that is restricted to specific datasets is rejected with `403 Forbidden` in that case, so always select a dataset explicitly when using a dataset-restricted token.


    ## Resource origins


    Most resources take an optional `metadata.labels["dash0.com/origin"]`. It is a stable identifier you choose for a resource you manage as code, so your Terraform configuration, Kubernetes manifests, CLI scripts or your own tooling can address the same resource on every apply without having to store the id Dash0 generated.


    An origin is unique per organization, not per dataset. Two resources of the same type in one organization cannot share an origin, even when they live in different datasets. If you want what is really the same rule in several datasets, put the dataset in the origin, for example `probabilistic-request-sampling-sandbox` and `probabilistic-request-sampling-nonprod`. The Dash0 Kubernetes operator does the same with the origins it generates. A duplicate origin is rejected with `400`.


    You cannot change an origin. Dash0 records it when the resource is created and ignores it on later updates, so you can read a resource, edit it and send it back without stripping the label out first.


    Endpoints with an `{originOrId}` path parameter take either identifier. A value that is not a UUID is read as an origin. A `PUT` to an origin that does not exist yet creates the resource with that origin, so you can apply the same manifest repeatedly.


    ## Request body size limit


    Most API endpoints enforce a maximum request body size of 256KB. Bulk

    endpoints accept a larger body size per request to accommodate batched

    payloads.


    Requests exceeding the applicable limit are rejected with a

    `413 Content Too Large` response.'
servers:
- url: https://api.eu-west-1.aws.dash0.com
  description: API endpoint for AWS region EU (Ireland)
- url: https://api.eu-central-1.aws.dash0.com
  description: API endpoint for AWS region EU (Germany)
- url: https://api.us-east-1.aws.dash0.com
  description: API endpoint for AWS region US (N. Virginia)
- url: https://api.us-west-2.aws.dash0.com
  description: API endpoint for AWS region US (Oregon)
- url: https://api.europe-west4.gcp.dash0.com
  description: API endpoint for GCP region EU (Netherlands)
tags:
- name: Manage Alerting
paths:
  /api/alerting/check-rules:
    get:
      summary: Retrieve a list of check rule ids
      parameters:
      - in: query
        name: dataset
        schema:
          $ref: '#/components/schemas/Dataset'
      - in: query
        name: idPrefix
        deprecated: true
        schema:
          type: string
        description: 'If provided, only check rules for which the origin starts with the given string are returned. (deprecated)


          The `originPrefix` query parameter takes precedence over this parameter if both are provided.

          '
      - in: query
        name: originPrefix
        schema:
          type: string
        description: If provided, only check rules for which the origin starts with the given string are returned.
      responses:
        '200':
          description: Successful response in case the list of check rules could be retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrometheusAlertRuleApiListItem'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Manage Alerting
      operationId: getApiAlertingCheckRules
      x-operation-id-source: derived
    post:
      summary: Create a new check rule
      parameters:
      - in: query
        name: dataset
        schema:
          $ref: '#/components/schemas/Dataset'
        required: false
        description: The associated dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrometheusAlertRule'
      responses:
        '200':
          description: Create a new check rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusAlertRule'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Manage Alerting
      operationId: postApiAlertingCheckRules
      x-operation-id-source: derived
  /api/alerting/check-rules/bulk:
    post:
      summary: Bulk create check rules
      description: 'Atomically create up to 1000 Prometheus alert rules in a single request.

        Create-only — every item produces a brand-new check rule. The public

        schema uses `id` as the user-defined origin; per-item resolution

        priority mirrors the single-rule POST handler (id → server-generated

        UUID with "api-" prefix). Any item whose resolved origin or id

        collides with an existing rule (including soft-deleted rules whose

        origin is still reserved by the unique constraint) is rejected with a

        per-item diagnostic.


        If any item fails validation (PromQL, intervals, summary length,

        template functions, origin/id collision, etc.) the whole batch is

        rejected with a 400 that carries per-item diagnostics in the message;

        nothing is written. On any DB failure the entire batch is rolled back

        and 500 is returned. The endpoint is not idempotent — a successful

        batch retried verbatim will 400 on every item the second time.


        This endpoint accepts request bodies up to 2 MB (vs. the 256 KB default

        for other endpoints) to accommodate batched payloads of up to 1000

        rules per request.'
      parameters:
      - in: query
        name: dataset
        schema:
          $ref: '#/components/schemas/Dataset'
        required: true
        description: The dataset to deploy rules into. Required to prevent accidental deployment to the wrong dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrometheusAlertRuleBulkCreateRequest'
      responses:
        '200':
          description: All items were successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusAlertRuleBulkCreateResponse'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Manage Alerting
      operationId: postApiAlertingCheckRulesBulk
      x-operation-id-source: derived
  /api/alerting/check-rules/{originOrId}:
    delete:
      summary: Delete a specific check rule (Prometheus alert rule) by origin or id
      parameters:
      - in: path
        name: originOrId
        schema:
          type: string
        required: true
        description: Check rule origin or id
      - in: query
        name: dataset
        schema:
          $ref: '#/components/schemas/Dataset'
      responses:
        '200':
          description: Successful response in case the check rule was deleted
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Manage Alerting
      operationId: deleteApiAlertingCheckRulesByOriginOrId
      x-operation-id-source: derived
    get:
      summary: Retrieve a specific check rule (Prometheus alert rule) by its origin or id
      parameters:
      - in: path
        name: originOrId
        schema:
          type: string
        required: true
        description: Check rule origin or id
      - in: query
        name: dataset
        schema:
          $ref: '#/components/schemas/Dataset'
      responses:
        '200':
          description: Successful response in case the check rule could be retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusAlertRule'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Manage Alerting
      operationId: getApiAlertingCheckRulesByOriginOrId
      x-operation-id-source: derived
    put:
      summary: Update or insert a specific check rule (Prometheus alert rule) by origin or id
      parameters:
      - in: path
        name: originOrId
        schema:
          type: string
        required: true
        description: Check rule origin or id
      - in: query
        name: dataset
        schema:
          $ref: '#/components/schemas/Dataset'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrometheusAlertRule'
      responses:
        '200':
          description: Successful response in case the check rule was updated. The response contains the updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusAlertRule'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Manage Alerting
      operationId: putApiAlertingCheckRulesByOriginOrId
      x-operation-id-source: derived
  /api/import/check-rule:
    post:
      summary: Import a check rule
      description: 'This endpoint allows you **to import an existing check rule** into your organization. It''s intended for one-time migrations rather than ongoing check rule management.

        Unlike the standard API, this endpoint supports importing check rules **with full editability**, allowing you to modify check rules that were previously created elsewhere.

        **Note:**

        This endpoint is **not recommended for Infrastructure-as-Code (IaC)** workflows. Using it in IaC scenarios can cause configuration drift and inconsistencies between your source configuration and the imported check rule state.

        Importing a check rule without an id will create a new check rule and return the created asset with a generated id.

        Importing a check rule with an existing id (metadata>dash0Extensions>id) will override the corresponding check rule definition. In case there is no check rule with the given id a new check rule will be created.'
      parameters:
      - in: query
        name: dataset
        schema:
          $ref: '#/components/schemas/Dataset'
        required: false
        description: The associated dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrometheusAlertRule'
      responses:
        '200':
          description: The imported check rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusAlertRule'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Manage Alerting
      operationId: postApiImportCheckRule
      x-operation-id-source: derived
  /api/import/check-rules:
    post:
      summary: Import multiple check rules in one batch
      description: 'Bulk variant of `/api/import/check-rule`. Atomically imports up to 1000

        Prometheus alert rules into your organization with **full editability**

        — the resulting rules behave like UI-created assets, not API-managed

        ones, so they can be modified in the Dash0 UI afterwards. Intended for

        one-time migrations rather than ongoing Infrastructure-as-Code

        management.


        Per-item id/origin resolution mirrors the single-rule import handler:

        items without an `id` receive a server-generated UUID; items with an

        `id` reuse it. Generated origins are **not** prefixed with `api-` and

        the rules remain UI-editable.


        Behaves like the regular bulk endpoint in every other respect: items

        are validated up-front, the whole batch is rejected on any item

        failure, nothing is written on rollback, and the endpoint is not

        idempotent. This endpoint accepts request bodies up to 2 MB (vs. the

        256 KB default for other endpoints) to accommodate batched payloads of

        up to 1000 rules per request.'
      parameters:
      - in: query
        name: dataset
        schema:
          $ref: '#/components/schemas/Dataset'
        required: false
        description: The associated dataset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrometheusAlertRuleBulkCreateRequest'
      responses:
        '200':
          description: All items were successfully imported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrometheusAlertRuleBulkCreateResponse'
        default:
          description: In case any error happens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Manage Alerting
      operationId: postApiImportCheckRules
      x-operation-id-source: derived
components:
  schemas:
    CheckThresholdBaseline:
      description: 'Adaptive baseline detector configuration. Its presence on `CheckThresholds` re-interprets

        `degraded` and `failed` as z-score cutoffs against the check rule''s own predicted value and

        typical spread.

        '
      properties:
        direction:
          $ref: '#/components/schemas/AnomalyDirection'
          description: 'Which deviations from the prediction fail the check. For a hand-written expression there

            is no `parsedExpression` and therefore no `thresholdComparator`, so this is the sole

            source of truth for directionality.

            '
        spreadFloor:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 'Optional minimum seasonal spread, expressed as a fraction of the prediction. The server

            default is used when omitted. For example, `0.05` makes a sensitivity cutoff of `3`

            require at least a 15% deviation when the measured spread is smaller.

            '
        volumeFloor:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 'Optional minimum traffic rate required for the detector to evaluate. Supported only

            for Services Metrics and Spans Metrics queries, in requests/second and spans/second

            respectively. Traffic is derived from the query''s authored selections, filters,

            grouping, and rate window and evaluated ad hoc at the detector timestamp. Dashboard

            variable placeholders are omitted, as in the observed check query.

            Other query types, including hand-written PromQL, cannot configure this floor.

            Export compiles this floor into a PromQL enablement condition with the authored filters

            and service namespace/name matching. Import retains the condition rather than a typed floor.

            No traffic query or volume gate is applied when omitted.

            '
      required:
      - direction
    PrometheusAlertRuleMetadataLabels:
      type: object
      description: 'Server-derived labels that apply to the alert-rule resource itself, not to the

        emitted alert. Currently includes `dash0.com/source` when the origin is known; see

        the `CrdSource` enum for the values it can take.

        '
      properties:
        dash0.com/source:
          $ref: '#/components/schemas/CrdSource'
    PrometheusAlertRuleApiListItem:
      description: The ID, origin, dataset, and the name of a check rule.
      properties:
        id:
          type: string
          description: 'The unique identifier of the check rule.


            For backward compatibility, this field is also filled with the origin, if it exists.

            However in a future version, this field will only return the actual check rule ID.

            '
        origin:
          type: string
          description: User defined origin for getting/updating/deleting the alert rule through the API.
        source:
          $ref: '#/components/schemas/CrdSource'
        dataset:
          $ref: '#/components/schemas/Dataset'
        name:
          type: string
          description: Human-readable and templatable name for the check. In Prometheus alerting rules this is called "alert".
      required:
      - id
      - dataset
    Error:
      properties:
        code:
          type: integer
          description: 'HTTP status code.

            '
        type:
          type: string
          description: 'Stable `snake_case` identifier for the kind of error, safe for clients to branch on. Not

            an enum: treat an unrecognized value the same as an absent one and fall back to `message`,

            so a new error kind never breaks the contract. Optional — absent means unclassified, not

            success.

            '
        message:
          type: string
          description: 'Human-readable description of the error. Safe to display.

            '
        traceId:
          type: string
          description: 'Trace ID for the request that produced the error, for correlating with logs and traces.

            '
      required:
      - code
      - message
    Dataset:
      type: string
      pattern: ^[a-zA-Z0-9_-]{3,26}$
      description: Optional dataset to query across. Defaults to whatever is configured to be the default dataset for the organization.
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    Duration:
      type: string
      pattern: (\d+(ms|s|m|h|d|w|M|Q|y))+
    CheckThresholds:
      description: "Thresholds to use for the `$__threshold` variable in the expression field.\n\nBy default `degraded` and `failed` are absolute values. The optional `baseline` and\n`changeGate` sub-objects are detector configuration: **the presence of one of them is the\ndiscriminator** that changes how `degraded` and `failed` are interpreted.\n\n- Neither present: `degraded` and `failed` are absolute values compared against the\n  expression's own value, as they always have been.\n- `baseline` present: `degraded` and `failed` are re-interpreted as z-score cutoffs —\n  multiples of the watched entity's own typical spread away from its prediction — rather\n  than as absolute values. Each configured cutoff must be greater than `0` and less than\n  `1000000`, the detector score cap.\n- `changeGate` present: `degraded` and `failed` stay absolute, but the check additionally\n  requires the value to have become materially worse than it recently was before it fails.\n\nAt most one of `baseline` and `changeGate` may be set. A request setting both is rejected\nwith a `400`; the mutual exclusion is enforced by the server rather than by this schema,\nmatching the existing treatment of `metric` versus `servicesMetricQuery`.\n"
      properties:
        degraded:
          type: number
          format: double
          description: 'The threshold value that defines when the check is in a degraded state. The value will be

            interpolated into the expression field as `$__threshold`.


            Interpreted as a z-score cutoff rather than an absolute value when `baseline` is set.

            '
        failed:
          type: number
          format: double
          description: 'The threshold value that defines when the check is in a failed state. The value will be

            interpolated into the expression field as `$__threshold`.


            Interpreted as a z-score cutoff rather than an absolute value when `baseline` is set.

            '
        baseline:
          $ref: '#/components/schemas/CheckThresholdBaseline'
          description: 'Compare the check rule''s observed quantity against its own past instead of against an

            absolute value. Setting this re-interprets `degraded` and `failed` as z-score cutoffs.


            Mutually exclusive with `changeGate`.

            '
        changeGate:
          $ref: '#/components/schemas/CheckThresholdChangeGate'
          description: 'Require the observed quantity to have changed materially compared to a recent window

            before the absolute `degraded` / `failed` thresholds are allowed to fail the check.

            `degraded` and `failed` remain absolute values.


            Mutually exclusive with `baseline`.

            '
    PrometheusAlertRuleBulkCreateRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/PrometheusAlertRule'
    PrometheusAlertRuleBulkCreateResponse:
      type: object
      required:
      - created
      properties:
        created:
          type: integer
          description: Number of check rules that were newly created.
    AnomalyDirection:
      type: string
      enum:
      - both
      - above
      - below
      description: 'Which deviations from the prediction are treated as anomalous.


        - `both`: Deviations in either direction are anomalous.

        - `above`: Only values above the prediction are anomalous.

        - `below`: Only values below the prediction are anomalous.

        '
    CheckThresholdChangeGate:
      description: 'Change gate configuration. Its presence on `CheckThresholds` leaves `degraded` and `failed`

        absolute, but additionally requires the observed quantity to be materially worse than it was

        over `baselineWindow` before the check fails. The check rule expression must provide the

        absolute threshold comparator through its parsed expression or a hand-written top-level

        comparison; otherwise the write is rejected.

        '
      properties:
        comparison:
          $ref: '#/components/schemas/ChangeGateComparison'
        value:
          type: number
          format: double
          description: 'The minimum change required, interpreted according to `comparison`.

            '
        baselineWindow:
          $ref: '#/components/schemas/Duration'
          description: 'The window the observed quantity''s recent level is derived from.

            '
        volumeFloor:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: 'Optional minimum average traffic rate over `baselineWindow` required for the detector

            to evaluate. Supported only for Services Metrics and Spans Metrics queries, in

            requests/second and spans/second respectively. Traffic is derived from the query''s

            authored selections, filters, grouping, and rate window and evaluated ad hoc. Dashboard

            variable placeholders are omitted, as in the observed check query.

            Other query types, including hand-written PromQL, cannot configure this floor.

            Export compiles this floor into a PromQL enablement condition with the authored filters

            and service namespace/name matching. Import retains the condition rather than a typed floor.

            No traffic query or volume gate is applied when omitted.

            '
      required:
      - comparison
      - value
      - baselineWindow
    ChangeGateComparison:
      type: string
      enum:
      - absolute_delta
      - relative_factor
      description: "How the change gate's `value` is compared against the observed quantity's recent level.\n\n- `absolute_delta`: The observed quantity must differ from its recent level by at least\n  `value`, in the unit of the observed quantity itself and in the worsening direction defined\n  by the rule's absolute threshold comparator.\n- `relative_factor`: The observed quantity must differ from its recent level by at least\n  `value` times in the worsening direction defined by the rule's absolute threshold comparator.\n"
    PrometheusAlertRuleMetadataAnnotations:
      type: object
      description: 'Server-populated annotations that apply to the alert-rule resource itself, not to the

        emitted alert. Read-only on responses; ignored on write if a valid date-time.

        '
      properties:
        dash0.com/deleted-at:
          type: string
          format: date-time
          description: 'Soft-delete timestamp. Present when the check rule has been deleted but not yet purged.

            Set by the server; read-only. Ignored on write if a valid date-time; a malformed value is rejected with a 400.

            '
    PrometheusAlertRuleMetadata:
      type: object
      description: 'Server-populated metadata for the alert rule. Read-only on responses; ignored on write.

        '
      properties:
        labels:
          $ref: '#/components/schemas/PrometheusAlertRuleMetadataLabels'
        annotations:
          $ref: '#/components/schemas/PrometheusAlertRuleMetadataAnnotations'
    CrdSource:
      description: "Origin of a Dash0 resource, derived from `dash0.com/origin` on read.\n- `ui`: created interactively in the Dash0 UI.\n- `terraform`: managed via the Dash0 Terraform provider.\n- `operator`: managed via the Dash0 Kubernetes operator.\n- `dash0-cli`: managed via the Dash0 CLI.\n- `platform`: owned by Dash0 rather than by anyone in your organization. Covers both\n  resources Dash0 generates from another resource you own (the recording rules an SLO\n  produces) and resources Dash0 ships with the product (the built-in views).\n- `identity-provider`: a team whose membership Dash0 keeps in sync with a directory\n  group from the organization's identity provider. Membership edits made by hand\n  revert on the next reconcile.\n- `api`: created directly through the API, and the fallback for any origin whose\n  prefix is not recognized.\n\nNew values may be added over time. Treat an unrecognized value as `api`\nrather than rejecting the response.\n"
      type: string
      enum:
      - ui
      - terraform
      - operator
      - dash0-cli
      - platform
      - identity-provider
      - api
    PrometheusAlertRule:
      description: 'Check rules represent a periodically evaluated expression to determine the health of a resource.

        The result of the evaluation are zero or more CheckEvaluations.

        '
      properties:
        dataset:
          $ref: '#/components/schemas/Dataset'
        metadata:
          $ref: '#/components/schemas/PrometheusAlertRuleMetadata'
        id:
          type: string
          description: User defined id for getting/updating/deleting the alert rule through the API.
        name:
          type: string
          description: Human-readable and templatable name for the check. In Prometheus alerting rules this is called "alert".
        expression:
          type: string
          description: "An editable PromQL expression that can leverage the complete Dash0 Query Language. It furthermore\nsupports a variable called $__threshold.\n\n- `$__threshold` can be used as a placeholder for both the degraded and failed thresholds. The\n  thresholds are defined in the thresholds field. When `$__threshold` is used in the expression,\n  the `thresholds` field is required and at least one of the thresholds must be defined.\n\n  Usage of `$__threshold` implies that the PromQL expression may have to be evaluated up to two\n  times using the degraded threshold and critical threshold respectively.\n\n- Top-level AND statements are treated as enablement conditions that specify when the check should\n  \"be running\", i.e., is active. The use-cases for enablement conditions are several, e.g., requiring\n  a minimum amount of requests being served before triggering due to errors rates,\n  maintenance windows or muted timeframes.\n"
        thresholds:
          $ref: '#/components/schemas/CheckThresholds'
        interval:
          $ref: '#/components/schemas/Duration'
          default: 1m
          description: 'Specifies a check evaluation frequency.

            '
        for:
          $ref: '#/components/schemas/Duration'
          default: 0s
          description: 'For, also called "pending duration", specifies a time duration for how long the expression must

            have been continuously satisfied before a check evaluation is created. When the check evaluation

            is created, its "start" timestamp is set to the instant the pending duration started elapsing.


            This is effectively equivalent to the "for" configuration in Prometheus alerting rules.


            Default value is 0s, meaning that the check would transition immediately into one of the degraded

            or critical states at the first failed evaluation.


            If for is not set to 0s (or equivalent, like 0m), its value must be larger than or equal to that

            of evaluationFrequency, as it does not make sense to expect the status of a check to change without another

            evaluation having occurred.

            '
        keep_firing_for:
          $ref: '#/components/schemas/Duration'
          default: 0s
          description: 'Keep firing for, also called "resolution duration", that specifies a time duration for how long

            the evaluation of the expression must be consistently healthy before an critical or degraded check

            enters the healthy state, or de-escalates from critical to degraded.


            This is effectively equivalent to the "keep_firing_for" configuration in Prometheus alerting rules.


            Default value is 0s, meaning that the check would transition immediately into the healthy state at

            the first successful evaluation.


            If keep_firing_for is not set to 0s (or equivalent, like 0m), its value must be larger than or equal

            to that of evaluationFrequency, as it does not make sense to expect the status of a check to change

            without another evaluation having occurred.

            '
        labels:
          type: object
          additionalProperties:
            type: string
          description: 'Label are key-value pairs that can be used to add additional metadata to a check. They map

            to Prometheus alerting rules'' "labels" field.

            '
        annotations:
          type: object
          properties:
            summary:
              type: string
              description: 'Human-readable and templatable summary for the check that allows you to customize the way the check

                is textually described in short form in the Dash0 UI, in notifications, etc. Limited to 255

                characters.

                '
              maxLength: 255
            description:
              type: string
              description: 'Human-readable and templatable description for the check that allows you to customize the way the

                rationale of the check is textually described in the Dash0 UI, in notifications, etc. This will

                be optimized in the design for long form viewing. Limited to 2048 characters.

                '
              maxLength: 2048
            folderPath:
              type: string
              description: Optional UI folder path for organising groups (e.g. '/infrastructure/hosts'). Nesting is expressed with '/' separators.
